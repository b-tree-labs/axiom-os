# this file from its images directory at start; a K3D node gets it as a mount.
[[download]]
name = "k3s-airgap-images"
version = "v1.31.5+k3s1"
dest = "base/k3s-airgap-images-{arch}.tar.zst"
url = "https://github.com/k3s-io/k3s/releases/download/v1.31.5%2Bk3s1/k3s-airgap-images-{arch}.tar.zst"
mode = "0644"
sizes = ["small", "medium"]
