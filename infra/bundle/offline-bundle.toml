#
# What the offline install bundle holds (python -m axiom.infra.deploy.offline_bundle).
# One bundle is built per release and per architecture, for the sizes below
# (ADR-215). micro is Compose and is not covered.
#
# Every entry is a pin. tests/infra/test_the_offline_bundle_holds_every_image_the_chart_names.py
# renders both charts at each size and fails when the rendered output names an
# image that is not listed here, so a chart change that adds or moves an image
# has to change this file in the same pull request.
schema = 1
sizes = ["small", "medium"]

# ADR-109: keyless, bound to the release workflow at the release's own tag.
# {version} is the bundle's version, read from the manifest the signature covers.
[signing]
issuer = "https://token.actions.githubusercontent.com"
identity = "https://github.com/b-tree-labs/axiom-os-private/.github/workflows/publish.yml@refs/tags/v{version}"

# The Python packages a role installs on first boot (the chart's packages.pin)
# are resolved inside this image, for the bundle's architecture, into wheels.
[python]
image = "ghcr.io/b-tree-labs/axiom-runtime:0.5.0"
wheelhouse_image = "axiom-wheelhouse"          # tagged with the chart's packages.version

# A group is bundled unless default = false. `chat` is off by default: the model
# server image is not published by any workflow yet, and the two images are
# several gigabytes. Build with `--group chat` to add it.
[groups]
node = {default = true, about = "the node's own roles"}
base = {default = true, about = "the cluster base (infra/charts/axiom-cluster)"}
k3d = {default = true, about = "K3D itself, for the small size"}
monitoring = {default = true, about = "metrics and alerts, on at medium"}
chat = {default = false, about = "the chat UI and the model server"}

