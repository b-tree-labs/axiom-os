version = "v3.16.4"                            # the version node-chart.yml proves the charts with
dest = "tools/helm"
url = "https://get.helm.sh/helm-v3.16.4-linux-{arch}.tar.gz"
member = "linux-{arch}/helm"
mode = "0755"
sizes = ["small", "medium"]
