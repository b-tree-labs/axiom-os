{{- with .Values.roles.partnerHealth }}{{- if .enabled }}
{{- /* W8: the platform asks after every partner site on a schedule and tells a
person when a site's data stops, a node is out of date, or an archive disk is
above 80%. The recipient is never a value here: AXIOM_PARTNER_HEALTH_ALERT_TO
comes from the Secret the operator writes from the vault; absent, the job
alerts the site operator recorded in the node's identity. */}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $.Release.Name }}-partner-health
  labels: {{- include "axiom-node.labels" (dict "root" $ "role" "partner-health") | nindent 4 }}
  annotations: {axiom.io/role: "partner-health", axiom.io/priority: "background"}
spec:
  schedule: {{ .schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          priorityClassName: {{ $.Release.Name }}-background
          securityContext: {runAsUser: {{ $.Values.runAsUser }}, runAsNonRoot: true}
          containers:
            - name: partner-health
              image: {{ include "axiom-node.image" $ | quote }}
              args:
                - axi
                - data
                - --json
                - partner-health
                {{- if .minVersion }}
                - --min-version
                - {{ .minVersion | quote }}
                {{- end }}
                {{- if .stoppedAfterH }}
                - --stopped-after-h
                - {{ .stoppedAfterH | quote }}
                {{- end }}
              env:
                - {name: AXIOM_PACKAGES, value: {{ $.Values.packages.pin | quote }}}
                - {name: AXIOM_PACKAGES_VERSION, value: {{ $.Values.packages.version | quote }}}
                - {name: AXIOM_NODE_CONFIG, value: /tmp/axiom-node.toml}
                - {name: AXIOM_NODE_TOML, value: {{ include "axiom-node.nodeToml" (dict "root" $ "cfg" .) | quote }}}
                {{- range $k, $v := .env }}
                - {name: {{ $k | quote }}, value: {{ $v | quote }}}
                {{- end }}
              {{- if .secretFrom }}
              envFrom: [{secretRef: {name: {{ .secretFrom }}}}]
              {{- end }}
              volumeMounts: [{name: data, mountPath: /data}]
          volumes:
            - name: data
              {{- if .shareVolumeOf }}
              persistentVolumeClaim: {claimName: {{ $.Release.Name }}-{{ .shareVolumeOf }}-data}
              {{- else }}
              emptyDir: {}
              {{- end }}
{{- end }}{{- end }}
