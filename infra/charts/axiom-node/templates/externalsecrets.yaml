{{- /*
A Secret that a role, service or job reads (`secretFrom`) is written by
External Secrets from the store (`secretFromStore: <key>`), so no Secret is
created by hand on a cluster (ADR-215). Every key under that entry in the
store becomes an environment variable of the same name.
*/ -}}
{{- $all := merge (dict) .Values.roles (default dict .Values.services) (default dict .Values.jobs) -}}
{{- range $name := keys $all | sortAlpha }}
{{- $cfg := index $all $name }}
{{- if and (ne (toString $cfg.enabled) "false") $cfg.secretFromStore }}
{{- if not $.Values.contract.enabled }}
{{- fail (printf "%s.secretFromStore needs contract.enabled: the secret store is part of the cluster base (ADR-215)" $name) }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required (printf "%s.secretFrom names the Secret that secretFromStore writes" $name) $cfg.secretFrom }}
  labels: {{- include "axiom-node.labels" (dict "root" $ "role" $name) | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.contract.secretRefresh }}
  secretStoreRef: {kind: ClusterSecretStore, name: {{ $.Values.contract.secretStore }}}
  target: {name: {{ $cfg.secretFrom }}, creationPolicy: Owner}
  dataFrom:
    - extract: {key: {{ $cfg.secretFromStore | quote }}}
---
{{- end }}
{{- end }}
{{- /* A Secret mounted as files (`mounts: [{secret, path, fromStore}]`) can come from the store too. */ -}}
{{- range $name := keys $all | sortAlpha }}
{{- $cfg := index $all $name }}
{{- if ne (toString $cfg.enabled) "false" }}
{{- range (default list $cfg.mounts) }}
{{- if and .secret .fromStore }}
{{- if not $.Values.contract.enabled }}
{{- fail (printf "%s.mounts: fromStore needs contract.enabled (ADR-215)" $name) }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secret }}
  labels: {{- include "axiom-node.labels" (dict "root" $ "role" $name) | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.contract.secretRefresh }}
  secretStoreRef: {kind: ClusterSecretStore, name: {{ $.Values.contract.secretStore }}}
  target: {name: {{ .secret }}, creationPolicy: Owner}
  dataFrom:
    - extract: {key: {{ .fromStore | quote }}}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- with .Values.packages.indexSecret }}{{ if .fromStore }}
{{- if not $.Values.contract.enabled }}{{- fail "packages.indexSecret.fromStore needs contract.enabled (ADR-215)" }}{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "packages.indexSecret.name" .name }}
spec:
  refreshInterval: {{ $.Values.contract.secretRefresh }}
  secretStoreRef: {kind: ClusterSecretStore, name: {{ $.Values.contract.secretStore }}}
  target: {name: {{ .name }}, creationPolicy: Owner}
  dataFrom:
    - extract: {key: {{ .fromStore | quote }}}
{{- end }}{{ end }}
