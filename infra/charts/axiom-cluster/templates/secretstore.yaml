{{- /*
The secret store `axiom`. With no provider configured, it reads Secrets from
one namespace in this cluster (written by the node vault or an operator)
through a read-only service account. Applied as a post-install hook, after
External Secrets' webhook is up.
*/ -}}
{{- $ns := .Values.externalSecrets.store.namespace -}}
{{- $inCluster := empty .Values.externalSecrets.store.provider -}}
{{- if $inCluster }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels: {app.kubernetes.io/part-of: axiom-cluster}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: axiom-secret-reader
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: axiom-secret-reader
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: axiom-secret-reader
  namespace: {{ $ns }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: axiom-secret-reader}
subjects:
  - {kind: ServiceAccount, name: axiom-secret-reader, namespace: {{ $ns }}}
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: axiom
  labels: {app.kubernetes.io/part-of: axiom-cluster}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  provider:
    {{- if $inCluster }}
    kubernetes:
      remoteNamespace: {{ $ns }}
      server:
        caProvider: {type: ConfigMap, name: kube-root-ca.crt, key: ca.crt, namespace: {{ $ns }}}
      auth:
        serviceAccount: {name: axiom-secret-reader, namespace: {{ $ns }}}
    {{- else }}
    {{- toYaml .Values.externalSecrets.store.provider | nindent 4 }}
    {{- end }}
