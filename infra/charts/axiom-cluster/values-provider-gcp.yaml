# large on GKE: Persistent Disk SSD, Traefik behind Cloud Load Balancing,
# Secret Manager.
storage:
  fast: {provisioner: pd.csi.storage.gke.io, parameters: {type: pd-ssd}, reclaimPolicy: Retain, allowVolumeExpansion: true}
  standard: {provisioner: pd.csi.storage.gke.io, parameters: {type: pd-balanced}, allowVolumeExpansion: true}
  localpv: {install: false}
ingress: {install: true}
externalSecrets:
  store:
    provider:
      gcpsm: {projectID: ""}
