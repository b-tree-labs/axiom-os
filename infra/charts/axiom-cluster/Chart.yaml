apiVersion: v2
name: axiom-cluster
description: The cluster base (ADR-215 layer 2). The contract names every size above micro relies on, provided by the platform where it can and installed here where it cannot.
type: application
version: 0.1.0
dependencies:
  - name: cert-manager
    version: v1.21.3
    repository: https://charts.jetstack.io
    condition: certManager.install
  - name: cloudnative-pg
    version: 0.29.1
    repository: https://cloudnative-pg.github.io/charts
    condition: cloudnativePg.install
  - name: external-secrets
    version: 2.14.0
    repository: https://charts.external-secrets.io
    condition: externalSecrets.install
  - name: traefik
    version: 42.1.3
    repository: https://traefik.github.io/charts
    condition: ingress.install
  - name: localpv-provisioner
    version: 4.6.0
    repository: https://openebs.github.io/dynamic-localpv-provisioner
    condition: storage.localpv.install
