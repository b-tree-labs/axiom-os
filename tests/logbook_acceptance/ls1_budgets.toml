# LS-1 (#1780): the performance budgets of the Log, the Timeline, the Tail, search and export.
#
# One file, read by the scale tests (which record what they measure under each key) and by
# scripts/ls1_scale_report.py (which writes the nightly job's summary and fails it). A budget is
# broken when a number is at or over its `limit`; a regression is a number more than `regression`
# (20%) over its stored `baseline` and more than `noise_ms` over it in absolute terms, so a 3 ms
# page that becomes 4 ms is not a regression. A `baseline` of 0 means none is stored yet: the
# report says so and does not fail on it. Raise a baseline by copying the nightly artifact's
# number here in a pull request that says why.
#
# status:
#   enforced  the scale job measures it, and fails over the limit or on a regression
#   tracked   measured and published, fails only on a regression (no budget agreed yet)
#   pending   not measured yet; `needs` names what lands it, and the report lists it

regression = 0.20
noise_ms = 5.0
scale_rows = 1000000
smoke_rows = 10000

# -- the records door (the Log) ---------------------------------------------------------------

[budget.log_first_page]
what = "first page of a log (200 rows, newest), server side"
limit = 200.0
baseline = 0.0
status = "enforced"
test = "tests/logbook_acceptance/test_w3_scale.py"

[budget.log_older_page]
what = "an older page of a log, keyset before_seq at the middle"
limit = 200.0
baseline = 0.0
status = "enforced"
test = "tests/logbook_acceptance/test_w3_scale.py"

[budget.log_filtered_page]
what = "first page with two filters (entry type and signer)"
limit = 200.0
