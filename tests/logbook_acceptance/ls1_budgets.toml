# #2182: the package is written to a file a batch at a time, every file spooled and hashed on the
# way, so its peak memory does not grow with the log (the scale test fails it over 64 MiB; built
# whole it was 449 MiB at 100,000 entries). Its manifest comes first and names every other file's
# hash, so the package's own first byte waits for the whole pass; what streams from the first batch
# is a view of the selection (GET /{logbook}/exports/stream), and that is the first-bytes budget.
[budget.export_100k_build]
what = "write the evidence package of a 100,000-entry log (JSON Lines) to a file, streamed"
baseline = 0.0
status = "tracked"
test = "tests/logbook_acceptance/test_w3_scale.py"

[budget.export_100k_first_bytes]
what = "export of 100,000 entries streams: first bytes under 1 s, constant memory"
limit = 1000.0
baseline = 0.0
status = "enforced"
test = "tests/logbook_acceptance/test_w3_scale.py"

[budget.archive_period_build]
what = "archive a sealed period of 100,000 entries: package written entry by entry, constant memory"
limit = 60000.0
baseline = 0.0
status = "pending"
needs = "the scale job sealing and archiving a 100,000-entry period (unit LD-5, attest.archive)"

# ADR-268 LF-A24: filtering a 100,000-entry log by one declared field (the scale fixture's `area`,
# a choice matching about a quarter of the entries) returns its first page within the records
# door's page budget. Measured 39 ms p95 on a loaded development Mac (2026-11-21); the nightly job
# stores the baseline.
[budget.field_filter_first_page]
what = "first page of a 100,000-entry log filtered by one declared field (ADR-268 LF-A24)"
limit = 200.0
baseline = 0.0
status = "enforced"
test = "tests/logbook_acceptance/test_lf2.py"

