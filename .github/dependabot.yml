version: 2
updates:
  # GitHub Actions are SHA-pinned; Dependabot bumps them in ONE weekly batch PR.
  # See docs/runbooks/repin-policy.md.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # Pip, npm, and Docker are grouped per area (one open pull request per
  # manifest directory), on the same weekly cadence. The lander holds a
  # pull request that only touches these files for a person.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Deliberate pins: the LaTeX parser's generated grammar needs the 4.11 antlr4 runtime, and
    # cryptography 49+ ships no Intel-Mac wheel. A bump of either breaks a test the narrowed PR
    # selection may not run (2026-10-26).
    ignore:
      - dependency-name: "antlr4-python3-runtime"
      - dependency-name: "cryptography"
        versions: [">=49"]
    groups:
      pip-root:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /packages/axiom-ext-data-platform
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pip-data-platform:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /packages/axiom-tests
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pip-axiom-tests:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /src/axiom/extensions/builtins/diagnostics
