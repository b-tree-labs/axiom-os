[extension]
name = "attest"
version = "0.1.0"
description = "Signed, append-only records of accountable human acts, kept in logbooks declared by extensions (ADR-142..147)"
license = "Apache-2.0"
owner = "b-tree-labs"
aeos_version = "0.1.0"
builtin = true

[extension.compatibility]
python = ">= 3.11"
axiom = ">= 0.10"

# Schema-per-extension persistence per ADR-052. Records, presentations and
# anchors are append-only, enforced by triggers in migration 0001.
[database]
needs_schema = true
migrations_path = "migrations"

# `<cli> log`: the command noun for logs and Platform events (ADR-243). One extension owns the
# noun; the system log extension hands its verbs to `log platform`.
[[extension.provides]]
kind = "cmd"
noun = "log"
entry = "axiom.extensions.builtins.attest.log_cli:main"
description = "Logs: read, write and sign entries, check a log's chain, and Platform events"
tier = "core"
intent_groups = ["operate"]

# `<cli> attest`: the old spelling of `log` (ADR-243), removed in v0.72.0. Every old verb maps
# onto its `log` form and says so on stderr. Hidden from help (tier internal).
[[extension.provides]]
kind = "cmd"
noun = "attest"
entry = "axiom.extensions.builtins.attest.cli:main"
description = "Deprecated: use `log`."
tier = "internal"

# /api/v1/attest: logbooks, drafts, confirmation, signing with a grant, records,
# verification and the live stream (ADR-144, ADR-146, ADR-147).
[[extension.provides]]
kind = "logbook"
id = "approvals"
file = "logbooks/approvals.toml"
description = "A person's decision on a held action, recorded with their name (logbook unit X3)"

[[extension.provides]]
kind = "logbook"
id = "settings_authority"
file = "logbooks/settings_authority.toml"
description = "A person's signed change to a setting that decides who may do what (ADR-284)"

[[extension.provides]]
kind = "api"
subpath = "/attest"
entry = "axiom.extensions.builtins.attest.api:register_routes"
description = "Logbooks, drafts, confirmation, grant signing, records and the live stream"

[[extension.provides]]
kind = "skill"
name = "attest.logbook_list"
path = "skills/logbook.py"
entry = "axiom.extensions.builtins.attest.skills.logbook:list_logbooks"
description = "List the logbooks declared on this node, their entry types and who may sign them"

[[extension.provides]]
kind = "skill"
name = "attest.logbook_validate"
path = "skills/logbook.py"
entry = "axiom.extensions.builtins.attest.skills.logbook:validate"
description = "Validate a logbook declaration file"

[[extension.provides]]
kind = "skill"
name = "attest.new"
path = "skills/sign.py"
entry = "axiom.extensions.builtins.attest.skills.sign:new"
description = "Write an entry and sign it at the prompt (CLI only; a person answers)"

[[extension.provides]]
kind = "skill"
name = "attest.sign"
path = "skills/sign.py"
entry = "axiom.extensions.builtins.attest.skills.sign:sign"
description = "Complete and sign a draft proposed for you (CLI only; a person answers)"

[[extension.provides]]
kind = "skill"
name = "attest.propose"
path = "skills/propose.py"
entry = "axiom.extensions.builtins.attest.skills.propose:propose"
description = "Propose an entry for a person to complete and sign (software proposes; it never signs)"

[[extension.provides]]
kind = "skill"
name = "attest.drafts"
path = "skills/propose.py"
entry = "axiom.extensions.builtins.attest.skills.propose:drafts"
