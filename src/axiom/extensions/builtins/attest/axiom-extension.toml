[[extension.provides]]
kind = "skill"
name = "attest.obligations_tick"
path = "skills/obligations.py"
entry = "axiom.extensions.builtins.attest.skills.obligations:tick"
description = "Record, publish and notify obligation changes, evaluate predicates and catch up cross-checks"

# Obligations: every minute, record and announce what came due or was missed.
[[extension.schedule]]
name = "attest_obligations_tick"
description = "Record, publish and notify obligation changes (missed-entry alarm)"
cadence = { kind = "interval", interval_seconds = 60 }
action = "attest.obligations_tick"
classification_ceiling = "internal"
raci_default = "autonomous"
retry = { max_attempts = 2, backoff = "exponential", dedup_window_seconds = 50 }

# Daily anchor over every site with a chain (ADR-143, Anchors). UTC midnight
# until per-site time zones are declared by the site configuration.
[[extension.schedule]]
name = "attest_daily_anchor"
description = "Sign a Merkle root over every logbook head at each site"
cadence = { kind = "cron", cron = "0 0 * * *", tz = "UTC", jitter_seconds = 60 }
action = "attest.anchor"
classification_ceiling = "internal"
raci_default = "autonomous"
retry = { max_attempts = 3, backoff = "exponential", dedup_window_seconds = 300 }

# Routine archiving by each log's declared rule (ADR-290 D8): archive past live_days, tombstone and
# hide past delete_after_days, signed as the human accountable for the scheduler. Never erases.
[[extension.schedule]]
name = "attest_archival"
description = "Archive and tombstone what each log's retention rule says is due"
cadence = { kind = "cron", cron = "15 2 * * *", tz = "UTC", jitter_seconds = 300 }
action = "attest.archival_tick"
classification_ceiling = "internal"
raci_default = "autonomous"
retry = { max_attempts = 2, backoff = "exponential", dedup_window_seconds = 3600 }

# Full chain verification weekly (spec-attestation, "Integrity on the heartbeat"); the
# incremental check runs on TIDY's existing heartbeat through `hygiene stat health`.
[[extension.schedule]]
name = "attest_full_verify"
description = "Verify every log's chain from sequence 1 and record the result"
cadence = { kind = "cron", cron = "30 3 * * 0", tz = "UTC", jitter_seconds = 300 }
action = "attest.verify_all"
classification_ceiling = "internal"
raci_default = "autonomous"
retry = { max_attempts = 2, backoff = "exponential", dedup_window_seconds = 3600 }

# Read-only skills (logbook_list, show, verify, drafts, unacknowledged, cosign_pending,
# seal_preview) and attest.propose, attest.supplement_propose and attest.seal_propose, which only
# write a draft, project to MCP through the skill
# registry (ADR-073). Signing skills declare surfaces = ("cli",) and never do.
[extension.mcp]
enabled = true
prefix = "axiom_attest"

# Signed approvals (logbook unit X3): with this on, a held action is approved or rejected only by
# a person signing an ACTION_DECISION in the approvals log. Off by default, so merging changes
# nothing for a node until an owner turns it on and grants someone the approver role.
[[flags]]
key = "approvals_signed"
description = "A held action is decided only by a person's decision recorded in the approvals log"
default = "off"
kind = "permission"
owner = "@maintainers"
review_by = 2027-02-10

# The Log's product switches (switches.py). Permanent: a site chooses each in Settings, so they are
# permission flags (never reported stale), off by default. The description is the name Settings shows.
# A shift log is a log that declares a site-clock period ([period.<id>]); while shift_logs is off it
# is not listed, read, drafted, signed or sealed anywhere, and its stored records are kept.
[[flags]]
key = "shift_logs"
description = "Shift logs: logs that follow the site's shift clock, with a close-out for each shift"
default = "off"
kind = "permission"
owner = "@maintainers"
review_by = 2027-02-10

# The Paper view of a log. The web app reads it; the server only declares it. A product may turn
# it on by default with [[flag_defaults]] in its own manifest.
[[flags]]
key = "log_paper"
description = "Paper view: read a log laid out as its paper form"
default = "off"
kind = "permission"
owner = "@maintainers"
review_by = 2027-02-10

# Acknowledgements (record kind "ack"): while off, none is drafted or signed and nothing asks anyone
# to acknowledge; signed ones stay readable. A site that already used them is kept on at upgrade.
[[flags]]
key = "log_acknowledgements"
description = "Log acknowledgements: people confirm they have read an entry, and see what waits for them"
default = "off"
kind = "permission"
owner = "@maintainers"
review_by = 2027-02-10
