# The settings authority log (ADR-284 B5, settings ledger chunk 2b): a person's signed change to
# a setting that decides who may do what (an authority key).
#
# One type, AUTHORITY_CHANGE, meaning approved. It names the section, the key, the operation
# (set or unset), the value, the revision the key takes and the site it applies to, and carries a
# digest that binds the signature to exactly that change. The settings ledger accepts the change only with the id of
# this record as evidence. A site grants the role with `axi attest role grant <person>
# site_authority`; an administration role never counts. Losing the role stops later signing and
# does not unwind what was signed while it was held.
[logbook]
id = "settings_authority"
version = "1"
display = "Settings authority"
shown_in_log = false
# Every decision here is an accountable act, signed by the person who made it (ADR-290).
signed = true
assurance = { posture = "sso" }

[[type]]
id = "AUTHORITY_CHANGE"
meanings = ["approved"]
roles = ["site_authority"]
assurance = { posture = "sso", fresh_within = "5m" }
devices = { sign = ["personal", "kiosk", "tablet"] }
fields = [
  { id = "section", type = "text", label = "Section", required = true },
  { id = "key", type = "text", label = "Setting", required = true },
  { id = "op", type = "text", label = "Change", required = true },
  { id = "value", type = "text", label = "Value", required = true },
  { id = "revision", type = "text", label = "Revision", required = true },
  { id = "scope", type = "text", label = "Site", required = true },
  { id = "change_digest", type = "text", label = "Digest of the change", required = true },
  { id = "summary", type = "text", label = "What changes" },
]
