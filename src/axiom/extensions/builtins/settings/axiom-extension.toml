# mcp: not-applicable -- settings view/edit CLI over local config; operator-only
[extension]
name = "settings"
version = "0.1.0"
description = "View and edit Axiom settings"
license = "Apache-2.0"
owner = "b-tree-labs"
aeos_version = "0.2.0"
chain_level = "B"
builtin = true

[extension.compatibility]
python = ">= 3.11"
axiom = ">= 0.10"

[[extension.provides]]
kind = "cmd"
noun = "settings"
entry = "axiom.extensions.builtins.settings.cli:main"
description = "View and edit Axiom settings"
tier = "core"
intent_groups = ["start"]

# /api/v1/settings — the web Settings panel's allowlisted face (read for anyone
# signed in; a narrower set changeable by the owner or an operator).
[[extension.provides]]
kind = "api"
subpath = "/settings"
entry = "axiom.extensions.builtins.settings.api:register_routes"
description = "Allowlisted node settings for the web Settings panel"

# settings.list / settings.get / settings.set reach MCP through the skills
# package; settings.set refuses the safety switches (CLI only).
[extension.mcp]
enabled = true
