[extension]
name = "library"
version = "0.3.0"
description = "Document library: upload, intake, classification and placement, bronze landing and retrieval indexing, with the document vocabulary supplied by the product as a registered taxonomy."
license = "Apache-2.0"
owner = "b-tree-labs"
aeos_version = "0.2.0"
chain_level = "B"
builtin = true

[extension.compatibility]
python = ">= 3.11"
axiom = ">= 0.10"

# Uploaded documents land in the retrieval corpus, so the library writes the
# same store harvested documents live in rather than keeping a second copy.
[[extension.consumes]]
kind = "extension"
package = "rag"

# Uploads land through the data platform's bronze writer and embed adapter.
[[extension.consumes]]
kind = "extension"
package = "data_platform"

[[extension.consumes]]
kind = "extension"
package = "http"

# /api/v1/library is its own mount nested in the web app's /api/v1, so the
# serving stack's authz hook runs on every request (a session and a gate key
# reach the same decision). See mount.py.
[[extension.provides]]
kind = "service"
name = "library"
entry = "axiom.extensions.builtins.library.mount:mount_spec"
description = "The library under /api/v1/library: upload, browse, preview, change, delete, restore, search"
prefix = "/api/v1/library"
requires_authz = true

[database]
needs_schema = true
migrations_path = "migrations"

[[extension.provides]]
kind = "cmd"
noun = "library"
entry = "axiom.extensions.builtins.library.cli:main"
description = "The document library: upload, ls, show, status, search, update, move, reextract, label, rm, restore, purge"
tier = "starter"
intent_groups = ["operate", "investigate"]

# ADR-182: how this service stays up through a deploy, update or migration.
[extension.availability]
switch = "blue-green"  # mounted on the http app; switches with it
readiness = "http:/healthz"
drain_s = 15
migrations = "expand-contract"
single_flight = false
verified_by = "../http/tests/test_every_mounted_service_answers_through_a_switch.py"

[[extension.provides]]
kind = "skill"
name = "library.delete"
entry = "axiom.extensions.builtins.library.skills.verbs:delete"
path = "skills/delete"
description = "Remove a document you filed from retrieval and every listing. Its bytes stay in bronze behind a tombstone, so library.restore can bring it back."
risk = "reversible-write"
side_effects = true
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "library.label"
entry = "axiom.extensions.builtins.library.skills.verbs:label"
path = "skills/label"
description = "Show, confirm or change a document's export-control label and its retention class."
risk = "reversible-write"
side_effects = true
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "library.purge"
entry = "axiom.extensions.builtins.library.skills.verbs:purge"
path = "skills/purge"
description = "Delete a removed document forever, only after its retention floor and outside any hold; recorded first."
risk = "destructive"
side_effects = true
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "library.list"
entry = "axiom.extensions.builtins.library.skills.verbs:list_items"
path = "skills/list"
description = "List the library documents you may see at your site, newest first, with filters."
risk = "read"
side_effects = false
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "library.restore"
entry = "axiom.extensions.builtins.library.skills.verbs:restore"
path = "skills/restore"
description = "Bring back a document you deleted, re-indexed from the bytes bronze kept."
risk = "reversible-write"
side_effects = true
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "library.search"
entry = "axiom.extensions.builtins.library.skills.verbs:search"
path = "skills/search"
description = "Find library documents by what they say (retrieval over your site's and your own corpus)."
risk = "read"
side_effects = false
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "library.show"
entry = "axiom.extensions.builtins.library.skills.verbs:show"
path = "skills/show"
description = "One library document: where it filed, who filed it, and whether retrieval can find it."
risk = "read"
side_effects = false
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "library.move"
entry = "axiom.extensions.builtins.library.skills.verbs:move"
path = "skills/move"
description = "File a document in another Data Book folder. The move is remembered, so later similar documents file there too."
risk = "reversible-write"
side_effects = true
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "library.reextract"
entry = "axiom.extensions.builtins.library.skills.verbs:reextract"
path = "skills/reextract"
description = "Run a document's extractors again from the bytes bronze kept (all, named ones, or only those whose version changed); the new results replace the current ones and every route is offered them."
risk = "reversible-write"
side_effects = true
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "library.status"
entry = "axiom.extensions.builtins.library.skills.verbs:status"
path = "skills/status"
description = "What happened to one file you uploaded: every pipeline stage, what each extractor found, where each output went, the export-control verdict and where the Data Book filed it."
risk = "read"
side_effects = false
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "library.share"
entry = "axiom.extensions.builtins.library.skills.verbs:share"
path = "skills/share"
description = "Share a Library file or folder with a person or group at your site, as viewer or editor, optionally until a date; remove someone; set general access (restricted, or everyone at the site with a role); or change its two sharing settings. Not a chat or session share: it changes who may open one Library file or folder, and every change is recorded."
risk = "reversible-write"
side_effects = true
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "library.access"
entry = "axiom.extensions.builtins.library.skills.verbs:access"
path = "skills/access"
description = "Who has access to a Library file or folder and why: its Owner, the people and groups with their roles and expiry (when you may see them), general access, and whether you may share it. Not your account's access or sign-in: one Library object's access list."
risk = "read"
side_effects = false
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "library.transfer"
entry = "axiom.extensions.builtins.library.skills.verbs:transfer"
path = "skills/transfer"
description = "Make someone already on a Library file's or folder's access list its Owner; you become an Editor and it stays where it is filed."
risk = "reversible-write"
side_effects = true
idempotent = false
requires = []

[[extension.provides]]
kind = "skill"
name = "library.request"
entry = "axiom.extensions.builtins.library.skills.verbs:request"
path = "skills/request"
description = "Ask the Owner for access to a Library file or folder (works from its address alone, which reveals nothing), see or withdraw your request, remind once a day; or, as someone who may share it, list its requests and approve (with the role you choose) or decline with a reason."
risk = "reversible-write"
side_effects = true
idempotent = false
requires = []

[[extension.provides]]
kind = "skill"
name = "library.ec_status"
entry = "axiom.extensions.builtins.library.skills.verbs:ec_status"
path = "skills/ec_status"
description = "Why a library file is held from retrieval (the controlled code and the kind of file), its export-control review trail, and whether you may release it."
risk = "read"
side_effects = false
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "library.ec_release"
entry = "axiom.extensions.builtins.library.skills.verbs:ec_release"
path = "skills/ec_release"
description = "Release one held file version for retrieval. Needs the site's ec-reviewer role; the uploader can never release their own file. The reason is required and the decision is attested."
risk = "reversible-write"
side_effects = true
idempotent = false
requires = []

[[extension.provides]]
kind = "skill"
name = "library.ec_keep_held"
entry = "axiom.extensions.builtins.library.skills.verbs:ec_keep_held"
path = "skills/ec_keep_held"
description = "Record that an ec-reviewer looked at a held file and keeps it held. The reason is required and the decision is attested."
risk = "reversible-write"
side_effects = true
idempotent = false
requires = []

[[extension.provides]]
kind = "skill"
name = "library.ec_rehold"
entry = "axiom.extensions.builtins.library.skills.verbs:ec_rehold"
path = "skills/ec_rehold"
description = "Take a release back: the file's text leaves retrieval and it is held again. An ec-reviewer or the uploader may; the reason is required and the decision is attested."
risk = "reversible-write"
side_effects = true
idempotent = false
requires = []

[[extension.provides]]
kind = "skill"
name = "library.update"
entry = "axiom.extensions.builtins.library.skills.verbs:update"
path = "skills/update"
description = "Change a document you filed: title, tags, collection, or visibility (which moves its chunks to the corpus the new audience reads)."
risk = "reversible-write"
side_effects = true
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "library.upload"
entry = "axiom.extensions.builtins.library.skills.verbs:upload"
path = "skills/upload"
description = "File a document in the library: guarded, landed in bronze, catalogued, classified and indexed for retrieval. On a bound install it is filed on the bound node."
risk = "reversible-write"
side_effects = true
idempotent = true
requires = []

# MVP-22 (W11): the label gates. Off in production until a person turns it on;
# the labels and retention classes are recorded and shown either way.
[[flags]]
key = "library_labels"
description = "Library items need a confirmed export-control label before they are ingested, retrieved or exported"
default = "off"
default_by_env = { staging = "on" }
kind = "permission"
owner = "@maintainers"
review_by = 2027-02-10

