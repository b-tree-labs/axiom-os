[[extension.provides]]
kind = "skill"
name = "data.preflight"
entry = "axiom.extensions.builtins.data_platform.skills.preflight:run"
path = "skills/preflight"
description = "Check a connector can reach its source and its bronze root."

[[extension.provides]]
kind = "skill"
name = "data.rederive"
entry = "axiom.extensions.builtins.data_platform.skills.rederive:run"
path = "skills/rederive"
description = "Apply a site's declarations to the rows already written. A unit filled in, a fault code declared, a role corrected — none of it could reach existing data, because the conform insert was ON CONFLICT DO NOTHING and row_hash hashes the source row, which does not change when a channel map does. The bronze we retain so we can re-derive was unreachable. Dry run by default: everything is executed and rolled back, so the count is what would actually happen rather than a prediction. Scoped by site, because re-deriving every site over one site's correction is how maintenance becomes an outage."

[[extension.provides]]
kind = "skill"
name = "data.refresh"
entry = "axiom.extensions.builtins.data_platform.skills.refresh:run"
path = "skills/refresh"
description = "Re-run a connector's pass over changes since its watermark."

[[extension.provides]]
kind = "skill"
name = "data.register"
entry = "axiom.extensions.builtins.data_platform.skills.register:run"
path = "skills/register"
description = "Register a connector — the landing zone a producer pushes into."

[[extension.provides]]
kind = "skill"
name = "data.sample"
entry = "axiom.extensions.builtins.data_platform.skills.medallion:sample"
path = "skills/sample"
description = "Some records, to see the shape of what a producer is sending. Bronze only, and capped: the served tiers answer with aggregate and series, and handing back raw rows there would bypass the population guard."

[[extension.provides]]
kind = "skill"
name = "data.series"
entry = "axiom.extensions.builtins.data_platform.skills.gold:series"
path = "skills/series"
description = "Bucketed series from a gold table — the input shape the analytics tool consumes. With group_by, one named line per population over the same buckets, which is what a measured-against-predicted overlay is. Without it, the same refusal as aggregate: one line blended across units or source classes is a line that means nothing."

[[extension.provides]]
kind = "skill"
name = "data.site_rename"
entry = "axiom.extensions.builtins.data_platform.skills.site_rename:run"
path = "skills/site_rename"
description = "Put one site's data back in one place. A renamed site kept its history under the old id and gathered new readings under the new one, so every question answered from either saw half. `axiom.infra.site_identity` stops it recurring; this is the rows already written. Dry run by default — it rewrites the column everything else is keyed and scoped by, and a count is usually what somebody wanted anyway. Tables are discovered, because a hardcoded list goes stale and a stale list here leaves a site half-renamed."

[[extension.provides]]
kind = "skill"
name = "data.tier_audit"
entry = "axiom.extensions.builtins.data_platform.skills.tier_audit:run"
path = "skills/tier_audit"
description = "Report the medallion's actual shape — how many base tables and views in each tier — and everything ADR-128 did not expect: an undeclared base table in gold, or a gold view serving bronze directly. Reads information_schema, changes nothing, fails nothing. A static test can hold the CODE to the rule; it cannot see the database, and the database is where the drift showed up."

[[extension.provides]]
kind = "skill"
name = "data.troubleshoot"
entry = "axiom.extensions.builtins.data_platform.skills.troubleshoot:run"
path = "skills/troubleshoot"
description = "Explain why a connector is failing, with the fix."

[[extension.provides]]
kind = "skill"
name = "data.uncertainty_coverage"
entry = "axiom.extensions.builtins.data_platform.skills.gold:uncertainty_coverage"
path = "skills/uncertainty_coverage"
description = "How much of the served surface can say how well it is known: per (site, stream), how many points declare their uncertainty sources (exact), how many carry only a magnitude (bounded), and how many carry neither (unclaimable). Plus the inventory of declared sources and whether each is shared across rows or drawn per reading."

[[extension.provides]]
kind = "skill"
