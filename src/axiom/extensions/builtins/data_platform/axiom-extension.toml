[[extension.provides]]
kind = "skill"
name = "data.aggregate"
entry = "axiom.extensions.builtins.data_platform.skills.gold:aggregate"
path = "skills/aggregate"
description = "Deterministic aggregate (sum/mean/min/max/std/count) of a gold column, with an optional time window and filter. Returns a provenance-stamped value that says which population it summarised. REFUSES to blend rows spanning more than one unit or source_class into a single number — a mean over a measurement and a model's prediction is not a measurement of anything. Pass group_by to split the answer instead (group_by='source_class' is the measured-versus-predicted comparison), narrow it with filter, or set allow_mixed to state the blend is intended."

[[extension.provides]]
