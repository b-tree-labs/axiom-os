[[extension.provides]]
kind = "skill"
name = "data.ingest"
entry = "axiom.extensions.builtins.data_platform.skills.ingest:run"
path = "skills/ingest"
description = "Run one connector's source → bronze → RAG pass."

[[extension.provides]]
kind = "skill"
name = "data.ingest_freshness"
entry = "axiom.extensions.builtins.data_platform.skills.ingest_freshness:run"
path = "skills/ingest_freshness"
description = "Which streams stopped advancing, and when. `silence` and CreditedGuard watch a LIVE producer's stream; they cannot say a site's silver data stopped four months ago, because then the producer is not running to notice. Requires a declared cadence to grade anything stale — without one it reports age and says the stream is ungraded, because a threshold invented here would be a number nobody agreed to."

[[extension.provides]]
kind = "skill"
name = "data.ingest_push"
entry = "axiom.extensions.builtins.data_platform.skills.ingest_push:run"
path = "skills/ingest_push"
