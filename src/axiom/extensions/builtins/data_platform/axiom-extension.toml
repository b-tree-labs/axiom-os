[[extension.provides]]
kind = "skill"
name = "data.catalog"
entry = "axiom.extensions.builtins.data_platform.skills.medallion:catalog"
path = "skills/catalog"
description = "What a medallion tier holds. One verb for every tier: bronze lists connectors with what landed and what the gate refused (by count — refused content is never readable through a generic verb); silver and gold list tables and views."

[[extension.provides]]
kind = "skill"
name = "data.conform_run"
entry = "axiom.extensions.builtins.data_platform.skills.conform_run:run"
path = "skills/conform_run"
description = "Run the real bronze→silver conform pass over every registered connector's bronze rows and upsert canonical rows into silver.signals. Site comes from the connector registry (axi data register --site). Reports the funnel and exits non-zero on a skipped connector or an unknown schema — no silent drops."

[[extension.provides]]
kind = "skill"
name = "data.conform_try"
entry = "axiom.extensions.builtins.data_platform.skills.conform_try:run"
path = "skills/conform_try"
description = "Dry-run a registered normalizer over one bronze record and report the canonical rows it yields, plus the mistakes silver would absorb silently — a duplicate channel, a naive timestamp, a missing unit. Writes nothing. Omit schema_ref to list what is registered."

[[extension.provides]]
kind = "skill"
name = "data.describe"
entry = "axiom.extensions.builtins.data_platform.skills.medallion:describe"
path = "skills/describe"
description = "The shape of one object in a tier: its columns and their types. Bronze refuses and says why — it holds the bytes a producer sent, in whatever shape they sent them, so there is no schema to describe."

[[extension.provides]]
kind = "skill"
name = "data.diagnose"
entry = "axiom.extensions.builtins.data_platform.skills.diagnose:run"
path = "skills/diagnose"
description = "Post-install health checks for the data platform."

[[extension.provides]]
kind = "skill"
name = "data.enroll"
entry = "axiom.extensions.builtins.data_platform.skills.enroll:run"
path = "skills/enroll"
description = "Enroll a source from its manifest: register the connector, record the site its rows belong to, and name the credential to issue."

[[extension.provides]]
kind = "skill"
name = "data.ensure_schema"
entry = "axiom.extensions.builtins.data_platform.skills.ensure_schema:run"
path = "skills/ensure_schema"
description = "Bring the conformance tier's schema up to the installed code — the silver.signals columns and the gold views. The Alembic-versioned extensions are `axi db migrate upgrade head`; this is the part that is raw DDL and was only ever applied by a conform pass, which is how a release can install cleanly and leave the database behind it. Reports the columns it actually added, read back after the fact. Skips index creation: that blocks writes and wants a maintenance window."

[[extension.provides]]
kind = "skill"
name = "data.freshness"
entry = "axiom.extensions.builtins.data_platform.skills.medallion:freshness"
path = "skills/freshness"
description = "What has stopped advancing. The two tiers answer DIFFERENT questions and both matter: bronze says whether a PRODUCER is still pushing, silver whether the CONFORM PASS is advancing. A live producer whose pass has stalled looks fresh on one and stale on the other, and telling those apart is the difference between chasing a DAQ and chasing a pipeline."

[[extension.provides]]
kind = "skill"
name = "data.gaps"
entry = "axiom.extensions.builtins.data_platform.skills.gaps:run"
path = "skills/gaps"
description = "What one site would need to declare, ordered by how much each would fix. A steward cannot declare what they cannot see, and every gap found on the live node this week was found because a person went looking, which is not a process. Each entry names the specific act that closes it and what closing it would DO, in rows and direction — withholding readings and adding a unit are opposite changes wearing the same word. Ordered by rows rather than severity, because a severity is a judgement made on a site's behalf."

[[extension.provides]]
kind = "skill"
name = "data.compare"
entry = "axiom.extensions.builtins.data_platform.skills.gold:compare"
path = "skills/compare"
description = "One quantity across sites, bucketed onto a shared time axis. The verb a cross-site question wants, and the one that makes declaring a role worth the effort. Refuses to overlay two units: a figure drawing kW against degC on one axis is a lie about comparability, and an aggregate over both is worse because the lie has no shape to notice."

[[extension.provides]]
kind = "skill"
name = "data.roles"
entry = "axiom.extensions.builtins.data_platform.skills.gold:roles"
path = "skills/roles"
description = "Which quantities the fleet can answer, and which sites answer each. Every other gold verb is keyed on table and column, and nobody asks a question in those terms — a researcher asks about wall temperature or a position, and the only part of a signal that carries a quantity portably is its role. Says for each whether it is actually comparable, since a role answered in two units is two questions sharing a name."

[[extension.provides]]
kind = "skill"
name = "data.ingest"
entry = "axiom.extensions.builtins.data_platform.skills.ingest:run"
path = "skills/ingest"
description = "Run one connector's source → bronze → RAG pass."

[[extension.provides]]
kind = "skill"
name = "data.ingest_freshness"
entry = "axiom.extensions.builtins.data_platform.skills.ingest_freshness:run"
path = "skills/ingest_freshness"
description = "Which feeds stopped advancing, and when. `silence` and CreditedGuard watch a LIVE producer's feed; they cannot say a site's data stopped four months ago, because then the producer is not running to notice. Reads gold.ingest_freshness and grades against `typical_gap`, the feed's OWN observed cadence, so an undeclared feed is still graded — refusing to grade without a declaration is how that four months went unreported. A declared cadence is an override."

[[extension.provides]]
kind = "skill"
name = "data.ingest_push"
entry = "axiom.extensions.builtins.data_platform.skills.ingest_push:run"
path = "skills/ingest_push"
description = "Land pushed rows for a connector (the push front door's peer)."

