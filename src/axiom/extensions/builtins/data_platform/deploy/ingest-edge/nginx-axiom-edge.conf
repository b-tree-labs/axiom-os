# Ingest edge behind an EXISTING nginx site (ADR-177), the alternative to the
# Caddyfile when the edge shares a host that already serves something else.
#
# ONE location, for the edge's two prefixes only. Paste it (or `include` this
# file) inside the site's existing `server { listen 443 ssl; ... }` block,
# BEFORE its `location /`. It matches /ingest, /ingest/..., /edge/... and
# nothing else, so every other path the site serves is untouched.
# The edge listens on 127.0.0.1:8787 (the container publishes it there).
location ~ ^/(ingest|edge)(/|$) {
    # A row batch is bounded in the app (AXIOM_INGEST_MAX_*, ADR-157); this is
    # the outer bound so an oversized body never reaches Python.
    client_max_body_size 64m;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite, never append: the edge must not see an address the client chose.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}
