    # --- Ingest edge: plain http must not carry a key (ADR-177) ---
    # OPTIONAL, recommended. Goes inside the site's port-80 `server { }` block,
    # ABOVE its `return 301 https://...` line (a server-level `return` runs
    # before any `location`, so this must come first). The site redirects http
    # to https, which is right for a browser and wrong for a collector: a
    # collector configured with http:// would send its key in the clear first.
    # This answers it with a 404 that its sender reads as "wrong address, hold
    # the data" and that says what to change.
    default_type text/plain;
    if ($uri ~ ^/(ingest|edge)(/|$)) {
        return 404 "The data intake takes https only. Set the intake address to https://$host\n";
    }
