    # --- Ingest edge (ADR-177): partner pushes and the platform's pull ---
    # Goes before `location /` in the HTTPS server block. Touches nothing else.
    # Needs nginx-ingest-edge-limits.conf installed first (README step 3).
    location /ingest/ {
        limit_req          zone=ingest_edge_req burst=100 nodelay;
        limit_conn         ingest_edge_conn 20;
        limit_req_status   429;
        limit_conn_status  429;
        access_log         /var/log/nginx/ingest-edge.access.log ingest_edge;
        client_max_body_size 32m;
        client_body_timeout  20s;
        proxy_pass         http://127.0.0.1:8787;
        proxy_set_header   Host              $host;
        # Overwrite, never append: the edge must not see an address the client chose.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }
    location /edge/ {
        limit_req          zone=ingest_edge_req burst=100 nodelay;
        limit_conn         ingest_edge_conn 20;
        limit_req_status   429;
        limit_conn_status  429;
        # A refused caller is closed at once. By default nginx keeps the
        # connection open to read and discard the rest of the body it already
        # refused, which lets one address fill the server's connection table
        # with connections it has been refused on.
        lingering_close    off;
        access_log         /var/log/nginx/ingest-edge.access.log ingest_edge;
        client_body_timeout 20s;
        proxy_pass         http://127.0.0.1:8787;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }
