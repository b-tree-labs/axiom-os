# Ingest edge: the http-level half of the nginx change (ADR-177).
#
# Install as /etc/nginx/conf.d/ingest-edge-limits.conf (the stock nginx.conf
# includes conf.d/*.conf inside its http block). It declares zones and a log
# format only; it changes nothing for any path until the location blocks in
# nginx-ingest-edge.conf use them. Declaring a zone costs a few megabytes.

# One client address may make this many requests a second and hold this many
# open at once to the edge's two prefixes. Partners send a request a second or
# so; the edge's own per-site budget (AXIOM_INGEST_RATE_PER_SECOND) is the fair
# share between sites, and these bound what any one address can do to the host
# the rest of the site shares.
limit_req_zone  $binary_remote_addr zone=ingest_edge_req:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=ingest_edge_conn:10m;

# The request line without its query string, so a key a client mistakenly sends
# as ?token=... is never written to disk by us. Referer and agent are omitted
# for the same reason: nothing here needs them.
log_format ingest_edge '$remote_addr [$time_local] "$request_method $uri" '
                       '$status $body_bytes_sent $request_time';

# OPTIONAL, and it changes the whole server, so it is the site owner's call:
# a client that opens connections and sends its request line one byte a minute
# is cut off after this long. nginx's default is 60s. The location blocks below
# cap what an open /ingest or /edge request may take, but a connection that has
# not yet said which path it wants is only bounded by these.
#client_header_timeout 15s;
