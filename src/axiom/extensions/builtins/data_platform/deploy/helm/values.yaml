# axiom-data-platform Helm chart — default values.
#
# Provider-driven by construction. The chart names no specific RDBMS
# or vector store at runtime; values are organized by abstraction
# (`database`, `vectorStore`) and the install command's
# `DatabaseKindProvider` + `VectorStoreProvider`s render the
# kind-specific image / DSN / extension wiring.
#
# DP-1 v1 reference impl: --db-kind postgres + --vector-kind pgvector
# → one Postgres-with-pgvector instance (the providers collapse to
# `database.internal.image = pgvector/pgvector:pg16` + skip a
# separate vector-store deploy).

nameOverride: ""
fullnameOverride: ""

# ------------------------------------------------------------------------
# Provenance rules (consumer-supplied; default = quarantine everything)
# ------------------------------------------------------------------------
# Mounted into the platform pods at /etc/axiom/rules/rules.toml.
provenanceRulesToml: |
  # No rules supplied. The bronze writer defaults to QUARANTINE for
  # every item — safe-by-default, nothing reaches RAG.
  # Supply rules via `axi data install --rules <file.toml>`.

# ------------------------------------------------------------------------
# Ingest connectors — one source instance per entry (name -> TOML string)
# ------------------------------------------------------------------------
# Mounted at $AXI_STATE_DIR/plinth/connectors/<name>.toml. The ingest
# code location enumerates connectors of every registered kind at load
# time (one corpus__<slug> asset + sensor each), so adding a source is
# config, not a redeploy of code. Empty = env-driven single source
# (legacy DP1_BOX_FOLDER_ID) still works.
#
# connectors:
#   research-corpus: |
#     [connector]
#     name = "research-corpus"
#     kind = "box"
#     bronze_root = "/var/lib/axiom/bronze"
#     default_tier = "rag-community"
#     [connector.params]
#     folder_id = "363592758132"
#   dept-archive: |
#     [connector]
#     name = "dept-archive"
#     kind = "box"
#     bronze_root = "/var/lib/axiom/bronze"
#     default_tier = "rag-org"
#     [connector.params]
#     folder_id = "228326101313"
connectors: {}

# ------------------------------------------------------------------------
# Bronze layer storage (auto-defaulted; override for sizing/posture)
# ------------------------------------------------------------------------
bronze:
  size: "100Gi"
  storageClass: ""   # empty = cluster default
  mountPath: "/var/lib/axiom/bronze"

# ------------------------------------------------------------------------
# Database (OLTP) — DatabaseKindProvider supplies these
# ------------------------------------------------------------------------
# `kind` selects the provider (postgres / mysql / sqlite / …). DP-1
# ships postgres as the only registered kind.
#
# `mode`:
#   internal — chart deploys the bundled DB. Provider supplies the
#              image (e.g. pgvector/pgvector:pg16 when co-located).
#   external — chart provisions no DB; pods point at .external.dsn.
database:
  kind: "postgres"
  mode: "internal"

  internal:
    # Provider-supplied. pgvector co-located with postgres overrides
    # these to pgvector/pgvector:pg16.
    image:
      repository: "postgres"
      tag: "16"
    # A declaration, not necessarily a limit. The k3s `local-path` provisioner
    # creates a host directory and ignores the requested size, so this number
    # binds nothing on such a cluster. On one deployment a volume declaring 10Gi
    # held 528 GB and `kubectl get pvc` still read `10Gi Bound` — healthy by
    # every surface anyone was watching. `store_health` compares the declaration
    # against actual usage for exactly that reason; set a storageClass that
    # enforces quota where one is available.
    storage: "100Gi"
    storageClass: ""

    # What the container may use. Without a limit the pod is BestEffort, and
    # nothing below can be sized: Postgres reads the HOST's memory, not its
    # cgroup, so every memory default it ships is wrong inside a container. On
    # one deployment the host had 498 GB and the pod was capped at 16Gi.
    resources:
      requests:
        cpu: "500m"
        memory: "4Gi"
      limits:
        memory: "16Gi"

    # Derived from resources.limits.memory by
    # axiom.infra.store_health.recommended_postgres_settings, which the health
    # check also quotes — a test asserts these stay equal, so prevention and
    # detection cannot drift into disagreeing about what correct means. Change
    # the limit above and these must be regenerated.
    tuning:
      sharedBuffers: "4GB"
      effectiveCacheSize: "12GB"
      maintenanceWorkMem: "2GB"
      workMem: "32MB"
      # Stock is 0.2, which on a 860-million-row table means autovacuum does not
      # fire until 172 million rows are dead — by which point the vacuum itself
      # competes with serving. The absolute threshold still protects small tables.
      autovacuumVacuumScaleFactor: "0.02"
    # /dev/shm for the postgres container. The Kubernetes default of 64 MB is
    # enough until a table is large, then parallel VACUUM and index builds fail
    # with "could not resize shared memory segment". Raising it needs a pod
    # restart, so it is set here rather than discovered during an incident.
    shmSize: "1Gi"
    database: "axiom"
    username: "axiom"
    password: ""    # rendered by `axi data install --db-password`

  external:
    dsn: ""         # postgresql://user:pass@host:port/db


# ------------------------------------------------------------------------
# Vector store — VectorStoreProvider supplies these
# ------------------------------------------------------------------------
# `kind` selects the provider (pgvector / qdrant / weaviate / …).
# `colocated=true` means the vector store shares the database instance
# (pgvector is a Postgres extension; the provider folded itself into
# `database.internal.image`). When colocated, no separate vector
# service is deployed.
vectorStore:
  kind: "pgvector"
  colocated: true

# ------------------------------------------------------------------------
# Image pull policy (applies to all pods unless overridden per-deploy)
# ------------------------------------------------------------------------
image:
  pullPolicy: "IfNotPresent"
  pullSecrets: []
