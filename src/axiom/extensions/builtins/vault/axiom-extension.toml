[[extension.provides]]
kind = "skill"
name = "vault.exposed"
entry = "axiom.extensions.builtins.vault.skills.values:exposed"
path = "skills/exposed"
description = "A credential appeared somewhere it should not have: record the exposure, then force-rotate it. Never prints a value."
risk = "reversible-write"
side_effects = true
idempotent = false
requires = [{ id = "ref", description = "the secret that leaked, as a reference (never the value)", fix = "pass ref=<scheme>://<path> or a stored name; list stored names with 'axi vault list'" }, { id = "where", description = "the surface the credential appeared on", fix = "pass where=<transcript|log|chat|url|...>, the place the value was seen" }]
produces = []
next_steps = [{ target = "vault.reconcile", when = "ok", why = "confirm the issuer now treats the old value as dead" }]
recipes = ["credential-leak-response"]

