[extension]
name = "features"
version = "0.1.0"
description = "What this node is for (its role and functions), and what else can be turned on or off without reinstalling."
license = "Apache-2.0"
owner = "b-tree-labs"
aeos_version = "0.1.0"
builtin = true

[extension.compatibility]
python = ">= 3.11"
axiom = ">= 0.10"

[[extension.provides]]
kind = "cmd"
noun = "features"
entry = "axiom.extensions.builtins.features.cli:main"
description = "What this node is for, and what else can be turned on"
tier = "starter"
intent_groups = ["start"]

[extension.mcp]
enabled = true
