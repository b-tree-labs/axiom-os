[extension]
name = "next"
version = "0.1.0"
description = "What a person would plausibly do next: up to five ranked offers from what they are looking at, who they are and their recent work — one list for the chat home, the chat slide-out, the CLI and MCP."
license = "Apache-2.0"
owner = "b-tree-labs"
aeos_version = "0.2.0"
chain_level = "B"
builtin = true

[extension.compatibility]
python = ">= 3.11"
axiom = ">= 0.10"

[[extension.provides]]
kind = "cmd"
noun = "next"
entry = "axiom.extensions.builtins.next.cli:main"
description = "What you would plausibly do next, ranked, with why"

# POST /api/v1/next — the cards under the chat home's composer and the slide-out's.
[[extension.provides]]
kind = "api"
subpath = "/next"
entry = "axiom.extensions.builtins.next.api:register_routes"
description = "Ranked next-step offers for the chat surfaces"

[extension.mcp]
enabled = true
