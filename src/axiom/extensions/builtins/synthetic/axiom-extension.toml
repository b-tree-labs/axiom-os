# mcp: not-applicable -- phase 1 is CLI + skill; an MCP tool lands with the fleet report in phase 2
[extension]
name = "synthetic"
version = "0.1.0"
description = "Synthetic journeys: scripted user-journey checks against a live web surface, run on a schedule and as a deploy gate (ADR-169)"
license = "Apache-2.0"
owner = "b-tree-labs"
aeos_version = "0.2.0"
chain_level = "B"
builtin = true

[extension.compatibility]
python = ">= 3.11"
axiom = ">= 0.10"

[[extension.provides]]
kind = "cmd"
noun = "synthetic"
entry = "axiom.extensions.builtins.synthetic.cli:main"
description = "Run scripted user-journey checks; exit 0 only when every step passed"
tier = "advanced"
intent_groups = ["operate"]

[[extension.provides]]
kind = "skill"
name = "synthetic.run"
path = "skills/run/"
entry = "axiom.extensions.builtins.synthetic.skills.run:run"
description = "Run one journey over HTTP and return pass, fail or unproven per step"
risk = "reversible-write"
side_effects = true
requires = []
