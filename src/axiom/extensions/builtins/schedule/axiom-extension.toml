[extension]
name = "schedule"
version = "0.1.0"
description = "PULSE — app-level domain scheduler. Per ADR-055 + prd-axiom-schedule + spec-axiom-schedule."
license = "Apache-2.0"
owner = "b-tree-labs"
aeos_version = "0.1.0"
builtin = true

[extension.compatibility]
python = ">= 3.11"
axiom = ">= 0.24"

# Schema-per-extension persistence per ADR-052.
[database]
needs_schema = true
migrations_path = "migrations"

# PULSE-1 firing mode. Distributed mode lands in PULSE-2 as a config change here.
[firing]
mode = "single_node"
lease_ttl_seconds = 30
tick_interval_seconds = 1

# PULSE agent — the Orchestrator class member that owns this primitive.
[[extension.provides]]
kind = "agent"
name = "pulse"
entry = "axiom.extensions.builtins.schedule:pulse_persona_path"
persona = "agents/pulse/persona.md"
description = "PULSE — app-level action scheduler: registers recurring/one-shot cadences and fires them with authz, idempotency, retry, and dead-letter."
role = "scheduler"
domain = "schedules, recurring jobs, timed actions"
namespaces = ["schedule"]
asks = ["what runs tonight", "schedule this every Monday"]

# Tools every other primitive can call to register / introspect schedules.
[[extension.provides]]
kind = "tool"
name = "schedule_register"
entry = "axiom.extensions.builtins.schedule.api:register"
description = "Register a recurring or one-shot action under PULSE."
idempotent = false
side_effects = "mutates_state"

[[extension.provides]]
kind = "tool"
name = "schedule_fire_now"
entry = "axiom.extensions.builtins.schedule.api:fire_now"
description = "Manual fire of a schedule (subject to authz)."
idempotent = false
side_effects = "mutates_state"

# axi schedule CLI noun — verbs map 1:1 to skill-fns per ADR-056.
[[extension.provides]]
kind = "cmd"
noun = "schedule"
entry = "axiom.extensions.builtins.schedule.cli:cli"
subcommands = ["register", "pause", "resume", "cancel", "list", "fire-now", "status", "agenda", "item"]

# [sender] — ADR-066 servant-naming render metadata. HERALD renders
# this as the locale-appropriate possessive surface ("Ben's PULSE {version}")
# on every channel. The canonical principal (@pulse:<context>) is derived,
# not declared here.
[sender]
display_name = "PULSE"

# Calendar connector CLI (auth-integrated): axi calendar connect.
[[extension.provides]]
kind = "cmd"
noun = "calendar"
entry = "axiom.extensions.builtins.schedule.calendar.cli:main"
description = "Connect a calendar (sign in + verify) and keep PULSE slots in sync."

# /api/v1/schedule/agenda — the agenda read for the signed-in web (MVP-24).
[[extension.provides]]
kind = "api"
subpath = "/schedule"
entry = "axiom.extensions.builtins.schedule.agenda_api:register_routes"
description = "The read-only agenda (runs, obligations, expiries) in site time"

# MCP posture (spec-builtin-mcp-server.md §6.3): only the agenda reads
# (schedule.items_list / schedule.items_show) project, because only they
# declare surfaces=["mcp"]. schedule_register / schedule_fire_now are
# write-side and stay off MCP until write-policy + audit-log construction
# per spec-builtin-mcp-server.md §8.
[extension.mcp]
enabled = true

# The agenda read (MVP-24). Keys are lowercase identifiers (ADR-210).
[[flags]]
key = "schedule_agenda"
description = "The agenda: scheduler runs, obligations and expiries in site time"
default = "off"
default_by_env = { development = "on", staging = "on", production = "off" }
kind = "release"
owner = "@maintainers"
review_by = 2027-02-10
remove_by = 2027-03-01
