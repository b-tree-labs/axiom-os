# mcp: not-applicable -- Platform events are CLI-only reads (prd-logging); operator forensics verbs
[extension]
name = "log"
version = "0.1.0"
description = "Platform events: the machine's own log, read through `log platform`"
license = "Apache-2.0"
owner = "b-tree-labs"
aeos_version = "0.2.0"
chain_level = "B"
builtin = true

[extension.compatibility]
python = ">= 3.11"
axiom = ">= 0.10"

# The noun `log` belongs to the attest extension (ADR-243); this extension's verbs are
# `<cli> log platform <verb>` (Platform events), each a skill below.

[[extension.provides]]
kind = "skill"
name = "log.tail"
path = "skills/platform.py"
entry = "axiom.extensions.builtins.log.skills.platform:tail"
description = "The latest Platform events, filtered"
risk = "read"
side_effects = false
idempotent = true

[[extension.provides]]
kind = "skill"
name = "log.verify"
path = "skills/platform.py"
entry = "axiom.extensions.builtins.log.skills.platform:verify"
description = "Check the Platform events audit chain"
risk = "read"
side_effects = false
idempotent = true

[[extension.provides]]
kind = "skill"
name = "log.stats"
path = "skills/platform.py"
entry = "axiom.extensions.builtins.log.skills.platform:stats"
description = "Platform events backend and counts"
risk = "read"
side_effects = false
idempotent = true

[[extension.provides]]
kind = "skill"
name = "log.export"
path = "skills/platform.py"
entry = "axiom.extensions.builtins.log.skills.platform:export"
description = "Every Platform event, or the last N days"
risk = "read"
side_effects = false
idempotent = true

[[extension.provides]]
kind = "skill"
name = "log.backend"
path = "skills/platform.py"
entry = "axiom.extensions.builtins.log.skills.platform:backend"
description = "The backend that keeps Platform events"
risk = "read"
side_effects = false
idempotent = true

[[extension.provides]]
kind = "skill"
name = "log.sinks"
path = "skills/platform.py"
entry = "axiom.extensions.builtins.log.skills.platform:sinks"
description = "The sinks Platform events are written to"
risk = "read"
side_effects = false
idempotent = true
