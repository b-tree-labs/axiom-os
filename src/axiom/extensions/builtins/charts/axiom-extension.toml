[extension]
name = "charts"
version = "0.1.0"
description = "Charts from answers: the chart kinds a result can honestly be drawn as, ranked for the question, bound and bounded for inline drawing; and the drawing itself (ADR-216, ADR-214)."
license = "Apache-2.0"
owner = "b-tree-labs"
aeos_version = "0.2.0"
chain_level = "B"
builtin = true

[extension.compatibility]
python = ">= 3.11"
axiom = ">= 0.10"

[[extension.provides]]
kind = "cmd"
noun = "charts"
entry = "axiom.extensions.builtins.charts.cli:main"
description = "Which charts a result can be drawn as, ranked for a question; draw a chart spec"

# POST /api/v1/charts/suggest, POST /api/v1/charts/render, GET /api/v1/charts/data/{ref}
[[extension.provides]]
kind = "api"
subpath = "/charts"
entry = "axiom.extensions.builtins.charts.api:register_routes"
description = "Chart suggestions for a result and the platform renderer for a ChartSpec 2.0"

[extension.mcp]
enabled = true

# The demo gallery (charts/demo.py): listed in the Charts navigation on a bare node; a product
# or a site sets it off to hide it there (search and a direct link still open it).
[[flags]]
key = "charts_demo_gallery"
description = "The demo gallery, one chart of every kind on sample data, is listed in the Charts navigation"
default = "on"
kind = "operational"
owner = "@maintainers"
review_by = 2027-02-10

# BEGIN axi-skills-emit-md (generated — do not edit)
[[extension.provides]]
kind = "skill"
name = "charts.group_visibility"
entry = "axiom.extensions.builtins.charts.skills:group_visibility"
path = "skills/group_visibility"
description = "Show or hide a chart group in the Charts navigation: your own group, or a site's prebuilt group. A hidden group is still found by search and opened by a link. The demo gallery is shown or hidden by its flag, charts_demo_gallery."
risk = "reversible-write"
side_effects = true
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "charts.kinds_group"
entry = "axiom.extensions.builtins.charts.skills:kinds_group"
path = "skills/kinds_group"
description = "Show me every chart kind: one chart of every ChartSpec 2.0 kind drawn from a site's own gold (lines, tiles, gauge, state, pie, scatter, heatmap, flame of the platform's own timing, 3D), with a looping replay of a recorded day, offered to every account as a prebuilt group on the Charts page. Each chart reads gold at draw time; a kind with no real source is labelled SAMPLE."
risk = "reversible-write"
side_effects = true
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "charts.prebuilt_groups"
entry = "axiom.extensions.builtins.charts.skills:prebuilt_groups"
path = "skills/prebuilt_groups"
description = "The prebuilt groups this node provides on the Charts page: shared by every account with access, never copied into anybody's saved views; open one like any group. Each says its kind (demo, site) and whether the navigation shows it (shown, hidden)."
risk = "read"
side_effects = false
idempotent = true

[[extension.provides]]
kind = "skill"
name = "charts.render"
entry = "axiom.extensions.builtins.charts.skills:render"
path = "skills/render"
description = "Draw a ChartSpec 2.0 with the platform renderer: SVG, the controls' resolved state, and notes. The one renderer every surface draws with."
risk = "read"
side_effects = false
idempotent = true

[[extension.provides]]
kind = "skill"
name = "charts.role_group"
entry = "axiom.extensions.builtins.charts.skills:role_group"
path = "skills/role_group"
description = "Offer a product's chart template on this node, filled by the site's map from roles to its own channels: a prebuilt group with a day picker, every chart drawn from gold for the chosen day in the site's time zone. Charts whose roles the site does not map are left out and named."
risk = "reversible-write"
side_effects = true
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "charts.saved"
entry = "axiom.extensions.builtins.charts.skills:saved"
path = "skills/saved"
description = "Chart's catalog: the charts you saved (from the Charts page or a chat answer), each by its stable catalog id; with an id, that chart drawn by the platform renderer, the same on the page, the CLI and MCP."
risk = "read"
side_effects = false
idempotent = true

[[extension.provides]]
kind = "skill"
name = "charts.suggest"
entry = "axiom.extensions.builtins.charts.skills:suggest"
path = "skills/suggest"
description = "Which charts a result can honestly be drawn as, ranked for the question: the data's profile, the top 2-3 chart kinds with a one-line reason each and a ChartSpec 2.0 bound to the data, every other kind that also fits, and why each other kind does not. Deterministic; a kind the data cannot support is never offered."
risk = "read"
side_effects = false
idempotent = true
# END axi-skills-emit-md
