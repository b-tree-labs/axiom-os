# OpenFGA model test for site.fga — the productized, runnable spec of the
# per-site read gate. Run with:  fga model test --tests site.fga.yaml
#
# It encodes the program's acceptance narrative as executable assertions:
#   1. each researcher sees ONLY their own site (exclusive), and
#   2. an admin grant of a second site makes that site readable — the
#      "grant → comes to life" moment, here as an added tuple + assertion.
#
# The concrete facilities (senna/prost/fangio/ut) appear ONLY as test data; the model
# itself names no site.

name: per-site read authorization (site.fga)

model_file: ./site.fga

tuples:
  # --- the platform + the cross-all operators group ------------------------
  - user: group:operators#member
    relation: admin
    object: platform:andretti
  - user: user:ut_op
    relation: member
    object: group:operators
  # every site is a child of the platform → operators view them all
  - user: platform:andretti
    relation: parent
    object: site:senna-loop
  - user: platform:andretti
    relation: parent
    object: site:prost-loop
  - user: platform:andretti
    relation: parent
    object: site:moss-loop
  - user: platform:andretti
    relation: parent
    object: site:andretti-reactor

  # --- single-site researchers: each sees only their own loop -------------
  - user: user:acu_rese
    relation: viewer
    object: site:senna-loop
  - user: user:vcu_rese
    relation: viewer
    object: site:prost-loop
  - user: user:tamu_rese
    relation: viewer
    object: site:moss-loop

  # --- a joint-org researcher granted TWO sites (the cross-site grant) -----
  - user: user:joint_rese
    relation: viewer
    object: site:senna-loop
  - user: user:joint_rese
    relation: viewer
    object: site:prost-loop

  # --- an embargoed account: blocked overrides a positive grant -----------
  - user: user:suspended
    relation: viewer
    object: site:senna-loop
  - user: user:suspended
    relation: blocked
    object: site:senna-loop

tests:
  - name: single-site researcher sees only their own site
    check:
      - user: user:acu_rese
        object: site:senna-loop
        assertions:
          viewer: true
      - user: user:acu_rese
        object: site:prost-loop
        assertions:
          viewer: false
      - user: user:acu_rese
        object: site:moss-loop
        assertions:
          viewer: false

  - name: operator sees every site (cross-all via platform admin)
    check:
      - user: user:ut_op
        object: site:senna-loop
        assertions:
          viewer: true
      - user: user:ut_op
        object: site:prost-loop
        assertions:
          viewer: true
      - user: user:ut_op
        object: site:andretti-reactor
        assertions:
          viewer: true

  - name: joint-org researcher sees exactly their granted set, not others
    check:
      - user: user:joint_rese
        object: site:senna-loop
        assertions:
          viewer: true
      - user: user:joint_rese
        object: site:prost-loop
        assertions:
          viewer: true
      - user: user:joint_rese
        object: site:moss-loop
        assertions:
          viewer: false

  - name: block overrides a positive grant
    check:
      - user: user:suspended
        object: site:senna-loop
        assertions:
          viewer: true      # positive grant present...
          blocked: true     # ...but blocked is set → substrate DENY-overrides

  - name: which sites a researcher can list (ListObjects powers the home page)
    list_objects:
      - user: user:acu_rese
        type: site
        relation: viewer
        assertions:
          - site:senna-loop
      - user: user:joint_rese
        type: site
        relation: viewer
        assertions:
          - site:senna-loop
          - site:prost-loop
      - user: user:ut_op
        type: site
        relation: viewer
        assertions:
          - site:senna-loop
          - site:prost-loop
          - site:moss-loop
          - site:andretti-reactor
