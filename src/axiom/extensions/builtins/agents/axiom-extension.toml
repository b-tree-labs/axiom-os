# mcp: applicable -- `ask` and `roster` are agent-invocable: a consuming harness
# delegates to a subject-matter expert instead of reasoning in its place. The
# lifecycle verbs (start/stop/status/register) stay operator-only.
[extension]
name = "agents"
version = "0.1.0"
description = "Agent service lifecycle management"
license = "Apache-2.0"
owner = "b-tree-labs"
aeos_version = "0.1.0"
builtin = true

[extension.compatibility]
python = ">= 3.11"
axiom = ">= 0.10"

[[extension.provides]]
kind = "cmd"
noun = "agents"
entry = "axiom.extensions.builtins.agents.cli:main"
description = "Manage always-on agent services (start, stop, status)"
tier = "advanced"
intent_groups = ["maintain"]

# Skills — invocable through axiom.infra.skills.SkillRegistry per ADR-056.
# Namespace = CLI noun (`agents`) → skill names `agents.<verb>`.

[[extension.provides]]
kind = "skill"
name = "ask"
path = "skills/ask.py"
entry = "axiom.extensions.builtins.agents.skills.ask:ask"
description = "Ask a subject-matter-expert agent to do something and return its answer"

[[extension.provides]]
kind = "skill"
name = "roster"
path = "skills/roster.py"
entry = "axiom.extensions.builtins.agents.skills.roster:roster"
description = "List the agents that can be addressed"

[[extension.provides]]
kind = "skill"
name = "address"
path = "skills/address.py"
entry = "axiom.extensions.builtins.agents.skills.address:address"
description = "Route an @handle message (@axi, @neut, @rivet, …) to the agent it names"

# BEGIN axi-skills-emit-md (generated — do not edit)
[[extension.provides]]
kind = "skill"
name = "agents.address"
entry = "axiom.extensions.builtins.agents.skills.address:address"
path = "skills/address"
description = ""
side_effects = true
idempotent = false

[[extension.provides]]
kind = "skill"
name = "agents.ask"
entry = "axiom.extensions.builtins.agents.skills.ask:ask"
path = "skills/ask"
description = ""
side_effects = true
idempotent = false

[[extension.provides]]
kind = "skill"
name = "agents.chain_priority"
entry = "axiom.extensions.builtins.agents.skills.chains:chain_priority"
path = "skills/chain_priority"
description = "Set a chain's priority: critical, high, normal or background. When the node is short of room, higher-priority chains keep writing and lower ones wait their turn (the strategy is the chains.pressure_strategy setting). Answers 'let this one finish first'."
risk = "reversible-write"
side_effects = true
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "agents.chain_stop"
entry = "axiom.extensions.builtins.agents.skills.chains:chain_stop"
path = "skills/chain_stop"
description = "Stop a chain of hand-offs: its next hand-off is refused, so it ends between steps, never in the middle of one. Answers 'stop that loop'. The stop and who asked are recorded."
risk = "reversible-write"
side_effects = true
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "agents.chains"
entry = "axiom.extensions.builtins.agents.skills.chains:chains"
path = "skills/chains"
description = "The chains of hand-offs in flight: each request that set agents handing work to each other, how long it has run, its deadline, how many hops, the last skill called and its status. Answers 'what are the agents doing', 'is anything looping'. Reads only."
risk = "read"
side_effects = false
idempotent = true
requires = []

[[extension.provides]]
kind = "skill"
name = "agents.roster"
entry = "axiom.extensions.builtins.agents.skills.roster:roster"
path = "skills/roster"
description = ""
side_effects = false
idempotent = true
