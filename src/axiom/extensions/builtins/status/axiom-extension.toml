[extension]
name = "status"
version = "0.3.0"
description = "System health dashboard"
license = "Apache-2.0"
owner = "b-tree-labs"
aeos_version = "0.1.0"
builtin = true

[extension.compatibility]
python = ">= 3.11"
axiom = ">= 0.10"

[[extension.provides]]
kind = "cmd"
noun = "status"
entry = "axiom.extensions.builtins.status.cli:main"
description = "System health dashboard"
tier = "starter"
intent_groups = ["start"]

# --- Self-knowledge: the node describes itself, live -------------------
# One skill behind every surface (chat tool via the skill scan, MCP for
# external harnesses, CLI later). Founder requirements: wicked fast
# (summary rides the system prompt; this is the drill-down) and always
# fresh (derived from the real registries at call time).

[[extension.provides]]
kind = "skill"
name = "status.describe"
entry = "axiom.extensions.builtins.status.skills.describe:run"
path = "skills/describe.py"
description = "Describe this node's own live configuration: extensions, mounts, tools, skills, sign-in, RAG corpus, database (section-scoped)"

[[extension.provides]]
kind = "tool"
name = "node_describe"
entry = "axiom.extensions.builtins.status.mcp_handlers:describe"
description = "This node's own live configuration (self-knowledge; never speculate — call this)"
idempotent = true
side_effects = "none"

[extension.mcp]
enabled = true
prefix = "axiom_node"

[[extension.mcp.tool]]
name = "node_describe"
mcp_name = "axiom_node__describe"
