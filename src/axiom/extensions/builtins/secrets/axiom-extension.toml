[extension]
name = "secrets"
version = "0.1.0"
description = "Operational secret store — SecretStoreProvider registry (OpenBao default). Distinct from KEEP/ADR-055; see docs/decisions/adr-001."
license = "Apache-2.0"
owner = "b-tree-labs"
aeos_version = "0.1.0"
builtin = true

[extension.compatibility]
python = ">= 3.11"
axiom = ">= 0.26"

# SEC-1 ships interface + registry only; no concrete providers, no CLI
# verbs (those land in SEC-2). The `service` kind is the resolver
# entry point other extensions consume via `secrets.resolve(ref, ctx)`.
# Deliberately NOT `kind = "tool"`: resolve() returns the raw Secret, and an
# idempotent tool declaration is auto-exposed to the chat agent surface
# (chat/tools.py manifest scan) — the resolver stays an in-process
# cross-extension API. resolve() itself is a read-through (idempotent);
# idempotency is not part of the service vocabulary, so it lives here in
# prose rather than as a field the schema rejects.
[[extension.provides]]
kind = "service"
name = "secret_resolver"
entry = "axiom.extensions.builtins.secrets:resolve"
description = "Resolve a SecretRef through the registered SecretStoreProvider."

# ``axi secrets`` — operator CLI surface. ADR-056: each verb is backed
# 1:1 by a skill function under ``secrets/skills/``. The #667 verbs
# (set/list/rm/get/audit/rotate-by-name/git-credential/wire-git) form
# the foreign-credential store: keychain-backed values, metadata index,
# KEEP-executed rotation.
[[extension.provides]]
kind = "cmd"
noun = "secrets"
entry = "axiom.extensions.builtins.secrets.cli:main"
subcommands = [
    "diagnose", "exposed", "rotate",
    "set", "list", "rm", "get", "audit",
    "git-credential", "wire-git",
]

# Named secret dependencies other extensions may declare are linted via
# `axi ext lint` (AEOS080/AEOS081); this extension itself needs none.

# MCP posture (spec-builtin-mcp-server.md §6.3): explicitly opted out.
# resolve() returns raw Secret material; the secrets surface stays CLI +
# in-process cross-extension API. Same posture as the memory manifest's note
# keeping credential tools out of the surface every harness registers.
[extension.mcp]
enabled = false
