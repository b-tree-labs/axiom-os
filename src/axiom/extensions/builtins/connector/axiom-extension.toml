# mcp: not-applicable -- operator registry CLI (add/status/reconnect); skills are registered without the mcp surface (ADR-072 bounded exposure)
[extension]
name = "connector"
version = "0.1.0"
description = "Cross-cutting connector primitive — install, status, reconnect, observability for every external vendor surface"
license = "Apache-2.0"
owner = "b-tree-labs"
aeos_version = "0.1.0"
builtin = true

[extension.compatibility]
python = ">= 3.11"
axiom = ">= 0.29"

# `axi connector` — the noun every extension that touches a vendor surface
# (HERALD, Calendar, RAG ingest, future) consults. This is a sibling
# primitive to GUARD / KEEP / HERALD / PULSE per ADR-NNN.
[[extension.provides]]
kind = "cmd"
noun = "connector"
entry = "axiom.extensions.builtins.connector.cli:main"
description = "Cross-cutting connector registry — install, status, reconnect"
tier = "core"

[[extension.provides]]
kind = "skill"
name = "add"
entry = "axiom.extensions.builtins.connector.skills.add:run"
path = "skills/add.md"
description = "Interactive wizard: configure a new connector instance."

[[extension.provides]]
kind = "skill"
name = "status"
entry = "axiom.extensions.builtins.connector.skills.status:run"
path = "skills/status.md"
description = "Show last-known outcome per registered connector."

[[extension.provides]]
kind = "skill"
name = "reconnect"
entry = "axiom.extensions.builtins.connector.skills.reconnect:run"
path = "skills/reconnect.md"
description = "Surface connectors needing reconnect + suggested next action."

# A standalone `list` skill was declared here but never implemented — no
# skill function, no CLI verb (registry listing rides `status` today). The
# declaration is dropped until the capability exists; re-add it alongside
# the skill function when registry listing splits out of `status`.
