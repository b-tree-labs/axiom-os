[[extension.provides]]
kind = "skill"
name = "analytics.compute"
entry = "axiom.extensions.builtins.analytics.skills.compute:run"
path = "skills/compute"
description = "Deterministic math over a numeric series (descriptive stats, regression/fit, calculus on samples). Call this instead of computing an average/total/slope/integral yourself; the result is provenance-stamped."
