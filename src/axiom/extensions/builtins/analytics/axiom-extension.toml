[extension]
name = "analytics"
version = "0.1.0"
description = "Deterministic series math (descriptive stats, trend/fit, calculus on samples) — ADR-113 Tiers 1-3"
license = "Apache-2.0"
owner = "b-tree-labs"
aeos_version = "0.1.0"
builtin = true

[extension.compatibility]
python = ">= 3.11"
axiom  = ">= 0.10"

[[extension.provides]]
kind        = "tool"
name        = "analytics"
entry       = "axiom.extensions.builtins.analytics.skills.compute:run"
description = "Compute a deterministic statistic/fit/calculus over a numeric series (sum, mean, std, percentile, linregress, polyfit, moving_average, rate_of_change, correlation, derivative, integral, cumsum, interpolate). Returns a provenance-stamped result. Use this instead of computing a number yourself."
idempotent   = true
side_effects = "none"

[[extension.provides]]
kind        = "cmd"
noun        = "analytics"
entry       = "axiom.extensions.builtins.analytics.cli:main"
description = "Deterministic series math over a list/JSON/CSV series."

