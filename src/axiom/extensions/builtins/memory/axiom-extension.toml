[extension]
name = "memory"
version = "0.6.0"
description = "Per-principal memory ledger (CompositionService-backed). Inspect, record, and migrate session memory. Surfaces a cross-tool MCP server so Claude Code / ChatGPT / Gemini / OpenCode / axi chat all converge on the same write path. Durable home for the memory subsystem as it grows — Cognee-inspired NodeSet + memify + tier-based storage will land here."
license = "Apache-2.0"
owner = "b-tree-labs"
aeos_version = "0.1.0"
builtin = true

[extension.compatibility]
python = ">= 3.11"
axiom = ">= 0.10"

[[extension.provides]]
kind = "cmd"
noun = "memory"
entry = "axiom.extensions.builtins.memory.cli:main"
description = "Inspect, record, and migrate a principal's memory ledger."
tier = "core"
intent_groups = ["start"]

# Pre-write semantic dedup at tool-dispatch (#202.3). Hooks onto
# `tool.pre_invoke` and, for memory-write tools, denies near-duplicate
# writes with a structured reason the LLM can act on. Priority 50 so
# it runs before audit-only hooks (so audit doesn't log writes that
# never happen). `fail_mode = "warn"` — dedup is an optimization,
# never a hard gate; a hook error must not block dispatch. Threshold
# tunable via AXIOM_MEMORY_DEDUP_THRESHOLD env (default 0.92).
[[extension.provides]]
kind = "hook"
events = ["tool.pre_invoke"]
entry = "axiom.policy.memory_dedup_hook:pre_invoke_handler"
priority = 50
fail_mode = "warn"
description = "Pre-write semantic dedup for memory-write tools (#202.3)"

# Universal serving transport #3 (ADR-087 D7 / PRD F4): the `/memory` query
# endpoint mounts on the composed #607 HTTP substrate. recall → serving gate →
# serialize, per request; side-by-side (default) + opt-in rank-level RRF fusion
# with a user's existing RAG (fuse, never ingest). requires_authz=True so the
# fail-closed substrate refuses to serve it without an authz hook.
[[extension.provides]]
kind = "service"
name = "memory_query_endpoint"
entry = "axiom.extensions.builtins.memory.serving_endpoint:memory_mount_spec"
description = "Policy-gated memory serving query endpoint /memory (cross-mem P3)."
deployment_profile = "server"

# NOTE: spec-memory.md §9.1 calls for an `[extension.storage]` block
# declaring memory_fragment_types + ephemeral_namespaces + extractors.
# The AEOS manifest schema doesn't yet allow that block; per
# spec-memory §9.1.7 migration path, the memory extension declares
# `episodic` writes here as a comment until the schema lands the
# storage section. Tracked alongside ADR-033 Stage 2.
#
#   memory_fragment_types  = ["episodic"]
#   ephemeral_namespaces   = []
#   extractors_registered  = []

# ---------------------------------------------------------------------------
# Aggregated MCP surface
# ---------------------------------------------------------------------------
# Declared as ordinary tools so the root server aggregates them like any other
# extension's. Names carry no `axiom_memory_` prefix: the aggregator adds
# `axiom_memory__` itself, and declaring it again yields the doubled
# `axiom_memory__axiom_memory_append`. The note below said migrating "requires extending the AEOS
# schema" — that is true of a canonical `mcp_server` capability kind, and not
# of declaring the tools individually, which the schema has always allowed and
# which the telemetry extension already does. The blocker was imagined, which
# is why two servers with no overlapping tool names were both being registered
# by every client.
#
# The three credential tools (`axiom_secrets_list`, `axiom_vault_audit`,
# `axiom_secrets_rotate_trigger`) are deliberately absent. They remain
# reachable through the CLI and the standalone server; they do not belong in
# the surface every harness registers by default, because that makes secrets
# tooling opt-out rather than opt-in for anyone whose reason to connect was
# cross-tool memory.

[[extension.provides]]
kind = "tool"
name = "append"
entry = "axiom.extensions.builtins.memory.mcp_server:tool_memory_append"
description = "Append a memory fragment to the cross-tool ledger."
idempotent = false

[[extension.provides]]
kind = "tool"
name = "show"
entry = "axiom.extensions.builtins.memory.mcp_server:tool_memory_show"
description = "Show one memory fragment by id."
idempotent = true

[[extension.provides]]
kind = "tool"
name = "recent"
entry = "axiom.extensions.builtins.memory.mcp_server:tool_memory_recent"
description = "Most recent memory fragments for the current principal."
idempotent = true

[[extension.provides]]
kind = "tool"
name = "search"
entry = "axiom.extensions.builtins.memory.mcp_server:tool_memory_search"
description = "Search the memory ledger by query."
idempotent = true

[[extension.provides]]
kind = "tool"
name = "recall"
entry = "axiom.extensions.builtins.memory.mcp_server:tool_memory_recall"
description = "Recall over the indexed memory corpus."
idempotent = true

[[extension.provides]]
kind = "tool"
name = "actions_recent"
entry = "axiom.extensions.builtins.memory.mcp_server:tool_actions_recent"
description = "Recent entries from the action provenance ledger."
idempotent = true

[[extension.provides]]
kind = "tool"
name = "actions_search"
entry = "axiom.extensions.builtins.memory.mcp_server:tool_actions_search"
description = "Filtered search over the action provenance ledger."
idempotent = true

[extension.mcp]
enabled = true

[[extension.mcp.tool]]
name = "append"

[[extension.mcp.tool]]
name = "show"

[[extension.mcp.tool]]
name = "recent"

[[extension.mcp.tool]]
name = "search"

[[extension.mcp.tool]]
name = "recall"

[[extension.mcp.tool]]
name = "actions_recent"

[[extension.mcp.tool]]
name = "actions_search"

# Transitional pre-AEOS bridge — runtime MCP server discovery
# (`axiom.extensions.mcp_generation`) reads this block. Migrating to a
# canonical `[[extension.provides]]` mcp_server kind requires extending
# the AEOS schema; tracked in docs/working/competitive-parity-gaps.md.
[mcp_servers.axiom-memory]
command = "python"
args = ["-m", "axiom.extensions.builtins.memory.mcp_server"]
description = "Cross-tool memory MCP server. Tools: axiom_memory_append (write), axiom_memory_show / axiom_memory_recent / axiom_memory_search (read). Carries `instructions` driving model discipline on append. Any MCP-aware client (Claude Code, ChatGPT, Gemini, OpenCode, axi chat) gets cross-session memory by registering this server."
