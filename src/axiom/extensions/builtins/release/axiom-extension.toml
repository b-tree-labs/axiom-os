# mcp: not-applicable -- RIVET release-lifecycle skills (bump/tag/CI watch) registered without the mcp surface; release actions stay operator-gated
[extension]
name = "release"
version = "0.6.0"
description = "Release lifecycle — version bumping, tagging, CI/CD pipeline monitoring, local-main sync. CLI noun is `release` (purpose); RIVET remains the LLM persona for reasoning over CI/release readiness."
license = "Apache-2.0"
owner = "b-tree-labs"
aeos_version = "0.1.0"
builtin = true

[extension.compatibility]
python = ">= 3.11"
axiom = ">= 0.10"

# RIVET — agent persona (LLM character). Used for reasoning over CI
# failures, release readiness, and pattern recognition. NOT the CLI
# noun (per ADR-056 §"Layering"; the CLI noun is `release`).
[[extension.provides]]
kind = "agent"
name = "rivet"
entry = "axiom.extensions.builtins.release.cli:main"
persona = "agents/rivet/persona.md"
description = "RIVET — release automation (cut/version-bump/tag), CI/CD pipeline + PR-check monitoring, local-main sync (fast-forward workspace default branches), CI-failure signalling, and a warn-only pull-request lander (batch, review, fix, propose; never merge)"
role = "CI/CD and release engineer"
domain = "CI health, releases, version bumps, PR landing"
namespaces = ["release"]
asks = ["why is CI red", "plan the next release"]

# `axi release` — the deterministic CLI surface. Consolidated from the
# pre-2026-05-30 `axi rivet` (verbose control surface) + the simple
# `axi release <part>` (now `axi release cut <part>`).
[[extension.provides]]
kind = "cmd"
noun = "release"
entry = "axiom.extensions.builtins.release.cli:main"
description = "Release: cut / status / mode / check / plan / sync / watch / unwatch / pause / resume / list / close / land / lock / unlock / lock-status / ci-health / ci-head / ci-sweep / ci-lint / ci-digest / ci-main-watch"
tier = "advanced"
intent_groups = ["build", "maintain"]
requires = ["git"]

# Skills — invocable through axiom.infra.skills.SkillRegistry per ADR-056.
[[extension.provides]]
kind = "skill"
name = "cut"
entry = "axiom.extensions.builtins.release.skills:cut"
path = "agents/rivet/skills/cut.md"
description = "Bump version, tag, and push (was the positional `axi release <part>`)"

[[extension.provides]]
kind = "skill"
name = "status"
entry = "axiom.extensions.builtins.release.skills:status"
path = "agents/rivet/skills/status.md"
description = "Show build and release status"

[[extension.provides]]
kind = "skill"
name = "mode"
entry = "axiom.extensions.builtins.release.skills:mode"
path = "agents/rivet/skills/mode.md"
description = "Show developer vs operator mode"

[[extension.provides]]
kind = "skill"
name = "check"
entry = "axiom.extensions.builtins.release.skills:check"
path = "agents/rivet/skills/check.md"
description = "Run pre-push prevention checks"

[[extension.provides]]
kind = "skill"
name = "plan"
entry = "axiom.extensions.builtins.release.skills:plan"
path = "agents/rivet/skills/plan.md"
description = "Show release plan"

[[extension.provides]]
kind = "skill"
name = "sync"
entry = "axiom.extensions.builtins.release.skills:sync"
path = "agents/rivet/skills/sync.md"
description = "Local-main sync across workspace repos"

[[extension.provides]]
kind = "skill"
name = "watch"
entry = "axiom.extensions.builtins.release.skills:watch"
path = "agents/rivet/skills/watch.md"
description = "Track a remote routine through to its PR"

[[extension.provides]]
kind = "skill"
name = "unwatch"
entry = "axiom.extensions.builtins.release.skills:unwatch"
path = "agents/rivet/skills/unwatch.md"
description = "Stop tracking a routine"

[[extension.provides]]
kind = "skill"
name = "pause"
entry = "axiom.extensions.builtins.release.skills:pause"
path = "agents/rivet/skills/pause.md"
description = "Pause a tracked routine"

[[extension.provides]]
kind = "skill"
name = "resume"
entry = "axiom.extensions.builtins.release.skills:resume"
path = "agents/rivet/skills/resume.md"
description = "Resume a paused routine"

[[extension.provides]]
kind = "skill"
name = "list"
entry = "axiom.extensions.builtins.release.skills:list_"
path = "agents/rivet/skills/list.md"
description = "List patterns / watched / paused (positional resource)"

[[extension.provides]]
kind = "skill"
name = "close"
entry = "axiom.extensions.builtins.release.skills:close"
path = "agents/rivet/skills/close.md"
description = "Close stale routines (positional resource)"

[[extension.provides]]
kind = "skill"
name = "land"
entry = "axiom.extensions.builtins.release.skills:land"
path = "skills/land"
description = "Report proposed batches, superseded pull requests, what is ready to land, and what needs a person, with estimated minutes saved. Warn mode proposes only."
risk = "read"
side_effects = false
idempotent = true

[[extension.provides]]
kind = "tool"
name = "pr_lander_report"
entry = "axiom.extensions.builtins.release.tools.pr_lander:report"
description = "Read-only backlog report for one repo: batches, superseded pull requests, ready to land, human decisions, and estimated minutes saved"
idempotent = true
side_effects = "calls_network"

[[extension.provides]]
kind = "adapter"
integration = "github"
entry = "axiom.extensions.builtins.release.adapters:GitHubForge"
description = "Read GitHub pull requests and Actions minutes. The token stays in GH_TOKEN from the host CI secret store."

[[extension.provides]]
kind = "adapter"
integration = "gitlab"
entry = "axiom.extensions.builtins.release.adapters:GitLabForge"
description = "Stub. GitLab merge trains and pipeline minutes are not wired."

[[extension.provides]]
kind = "adapter"
integration = "testmon"
entry = "axiom.extensions.builtins.release.selectors:TestmonSelector"
description = "Affected tests from pytest-testmon. The whole suite when the map is missing, stale, or the change touches setup or dependencies."

[[extension.provides]]
kind = "adapter"
integration = "test-selector-null"
entry = "axiom.extensions.builtins.release.selectors:NullSelector"
description = "Run the whole suite. For a repository with no Python test map."

[[extension.provides]]
kind = "adapter"
integration = "fix-mechanical"
entry = "axiom.extensions.builtins.release.fixes:MechanicalFixProvider"
description = "Diagnose a blocker and draft a diff through the ci_repair skill. Does not push."

[[extension.provides]]
kind = "adapter"
integration = "fix-null"
entry = "axiom.extensions.builtins.release.fixes:NullFixProvider"
description = "No mechanical diff. Every blocker is a person's decision."

[[extension.provides]]
kind = "adapter"
integration = "fix-handoff"
entry = "axiom.extensions.builtins.release.handoff:WebhookHandoffFixProvider"
description = "When a built-in repair cannot draft a diff, POST one fix request and take the side branch back through the approval gate. Does not push."

# The load-bearing dispatcher target — never drop this from the
# release skill registry. See the 2026-06-01 autopsy in
# skills/__init__.py for the regression history.
[[extension.provides]]
kind = "skill"
name = "heartbeat"
entry = "axiom.extensions.builtins.release.skills:heartbeat"
path = "skills/heartbeat/SKILL.md"
description = "Proactive CI sweep — fired by launchd/systemd every heartbeat_interval; writes ~/.axi/agents/rivet/heartbeat.jsonl"

[[extension.provides]]
kind = "skill"
name = "ci_repair"
entry = "axiom.extensions.builtins.release.skills:ci_repair"
path = "skills/ci_repair/SKILL.md"
description = "Name the mechanical repair for a CI failure and how to resubmit it. Exposed on the Axiom MCP."

[[extension.provides]]
kind = "skill"
name = "review"
entry = "axiom.extensions.builtins.release.skills:review"
path = "skills/review/SKILL.md"
description = "Pick a review model that did not write the change. Exposed on the Axiom MCP."

# CI health: detect Actions waste, fix what is safe, prevent the rest.
[[extension.provides]]
kind = "skill"
name = "ci_health"
entry = "axiom.extensions.builtins.release.skills:ci_health"
path = "skills/ci_health/SKILL.md"
description = "Actions spend, run-rate projection, percent of budget, minutes by repo/workflow/event/job, and waste signals. Reads only. Exposed on the Axiom MCP."
risk = "read"
side_effects = false
idempotent = true

[[extension.provides]]
kind = "skill"
name = "ci_sweep"
entry = "axiom.extensions.builtins.release.skills:ci_sweep"
path = "skills/ci_sweep/SKILL.md"
description = "The hourly check: cancel superseded runs, record the budget state landing obeys, and alert through notifications on a crossing."

[[extension.provides]]
kind = "skill"
name = "ci_lint"
entry = "axiom.extensions.builtins.release.skills:ci_lint"
path = "skills/ci_lint/SKILL.md"
description = "Warn on workflow shapes that waste CI minutes. Never blocks. Exposed on the Axiom MCP."
risk = "read"
side_effects = false
idempotent = true

[[extension.provides]]
kind = "skill"
name = "ci_main_watch"
entry = "axiom.extensions.builtins.release.skills:ci_main_watch"
path = "skills/ci_main_watch/SKILL.md"
description = "Read the default branch from outside the local watch and keep its one incident. Writes only with act."

[[extension.provides]]
kind = "skill"
name = "ci_digest"
entry = "axiom.extensions.builtins.release.skills:ci_digest"
path = "skills/ci_sweep/SKILL.md"
description = "Weekly CI-health digest through notifications."

# The ci-health check reads billing and run APIs. It never starts an Actions job.
[[extension.schedule]]
name = "release_ci_health_tick"
description = "Read Actions spend and waste, cancel superseded runs, and alert on a budget or waste crossing"
cadence = { kind = "interval", interval_seconds = 3600 }
action = "release.ci_sweep"
classification_ceiling = "internal"
raci_default = "autonomous"
retry = { max_attempts = 2, backoff = "exponential", dedup_window_seconds = 1800 }

[[extension.schedule]]
name = "release_ci_digest_weekly"
description = "Send the weekly CI-health digest"
cadence = { kind = "cron", cron = "0 14 * * 1", tz = "UTC", jitter_seconds = 300 }
action = "release.ci_digest"
classification_ceiling = "internal"
raci_default = "autonomous"
retry = { max_attempts = 2, backoff = "exponential", dedup_window_seconds = 3600 }

# LOOP-S6: the release cut refuses a commit that is not on main or has no passing smoke
# result: the deploy's own smoke run, kept by commit in the journey store, for it or an
# ancestor with no shipped change since (`release cut --run-smoke URL` runs one on demand).
# Off until the owner turns it on (ADR-257 D4).
[[flags]]
key = "release_smoke_gate"
description = "A release is cut only from a main commit whose smoke journeys passed"
default = "off"
kind = "release"
owner = "@maintainers"
review_by = 2027-02-10
remove_by = 2027-03-01

# Daemon
[agent]
default_consent = "opt-in"  # watches GitHub CI — a network reach the operator opts into
heartbeat_interval = 300
startup = "daemon"
heartbeat_command = "release heartbeat"

[agent.env]
HOME = "${HOME}"

[[agent.watchers]]
name = "ci_monitor"
enabled = true
interval = 300
module = "axiom.extensions.builtins.release.ci_monitor"
function = "check_pipelines"

[[agent.watchers]]
name = "local_sync"
enabled = true
interval = 300
module = "axiom.extensions.builtins.release.local_sync"
function = "sync_workspace"

# [sender] — ADR-066 servant-naming render metadata. HERALD renders
# this as the locale-appropriate possessive surface ("Ben's RIVET {version}")
# on every channel. The canonical principal (@rivet:<context>) is derived,
# not declared here.
[sender]
display_name = "RIVET"

