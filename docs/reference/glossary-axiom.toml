# Axiom Core Glossary
#
# Domain-agnostic terms used throughout the Axiom framework.
# axiom and other domain layers extend these via their own glossary files.
#
# Managed by: Axiom core team
# Queried via: axi glossary --layer axiom
# See: docs/specs/spec-glossary-system.md

# ---------------------------------------------------------------------------
# Access & Sensitivity Model
# ---------------------------------------------------------------------------

[[terms]]
id         = "tier"
layer      = "axiom"
term       = "Tier"
definition = """
An access sensitivity level that determines which physical store holds content
of that tier, whether cloud embedding is permitted, and what processing boundary
applies. Tier names and properties are defined by the domain configuration —
Axiom assigns none by default.

Axiom recognises three tier archetypes by their properties:
  public      — cloud embedding allowed; standard local store
  restricted  — no cloud embedding; requires isolated store
  classified  — no cloud embedding; requires isolated store; additional
                processing boundary enforced by the domain
"""
properties = ["cloud_embedding_allowed", "requires_isolated_store",
              "processing_boundary"]
see_also   = ["scope", "isolated_store", "domain_configuration",
              "processing_boundary"]
example    = """
A domain configuration might define three tiers:
  public      (cloud embedding allowed, local store)
  restricted  (no cloud, isolated store)
  classified  (no cloud, isolated store, regulated boundary)
"""
extends    = false

[[terms]]
id         = "scope"
layer      = "axiom"
term       = "Scope"
definition = """
The visibility boundary of a piece of content, independent of its sensitivity
tier. Scope determines who may discover and retrieve an item, not whether
cloud processing is permitted (that is determined by tier).

Three scope values are defined at the Axiom level:
  community  — visible to all subscribers of a domain pack
  tenant     — visible only within the deploying organisation
  personal   — visible only to the creating user
"""
see_also   = ["tier", "domain_pack"]
example    = """
A publicly available NRC regulatory guide has:
  tier  = public, scope = community

An operator's personal note attached to a procedure has:
  tier  = restricted, scope = personal

A tenant-internal SOP has:
  tier  = restricted, scope = tenant
"""
extends    = false

[[terms]]
id         = "processing_boundary"
layer      = "axiom"
term       = "Processing Boundary"
definition = """
A constraint specifying where computation involving content of a given tier
may occur. Processing boundaries are defined in domain configuration and
enforced by the gateway and RAG store.

Examples of boundary values: local, site_network, isolated_enclave.
"""
see_also   = ["tier", "isolated_store"]
extends    = false

[[terms]]
id         = "isolated_store"
layer      = "axiom"
term       = "Isolated Store"
definition = """
A physical embedding and retrieval store that is network-isolated from
cloud services. Required for tiers with cloud_embedding_allowed = false.
The specific store implementation (e.g. PostgreSQL on a private node,
an air-gapped vector index) is defined by the domain infrastructure spec.
"""
see_also   = ["tier", "processing_boundary"]
extends    = false

# ---------------------------------------------------------------------------
# Knowledge Infrastructure
# ---------------------------------------------------------------------------

[[terms]]
id         = "domain_pack"
layer      = "axiom"
term       = "Domain Pack"
definition = """
A curated, versioned collection of documents, embeddings, and structured
facts for a specific subject area. Domain packs are the atomic subscription
unit of the community corpus.

A domain pack has:
  - A unique id and semantic version
  - A declared access tier
  - A set of source documents with embedding provenance
  - An optional set of knowledge facts (Layer 2+)
  - A sync protocol entry for community distribution
"""
see_also   = ["bundle", "community_corpus", "knowledge_maturity",
              "embedding_provenance"]
extends    = false

[[terms]]
id         = "bundle"
layer      = "axiom"
term       = "Bundle"
definition = """
A named preset that selects a set of domain packs appropriate for a
particular user persona or role. Bundles are an install-time convenience;
they do not create new packs and do not affect the individual pack sync
lifecycle.

Example: a "researcher" bundle might include the procedures pack, the
simulation codes pack, and the domain-specific data pack.
"""
see_also   = ["domain_pack"]
extends    = false

[[terms]]
id         = "community_corpus"
layer      = "axiom"
term       = "Community Corpus"
definition = """
The shared, version-controlled collection of domain packs distributed to
all subscribing deployments. The community corpus is distinct from a
tenant's internal corpus (scope = tenant) and personal content
(scope = personal).
"""
see_also   = ["domain_pack", "scope"]
extends    = false

[[terms]]
id         = "knowledge_maturity"
layer      = "axiom"
term       = "Knowledge Maturity"
definition = """
A six-layer model describing the epistemic state of a piece of content in
the RAG corpus:

  Layer 0 — Data        Raw documents and artefacts, indexed but unvalidated
  Layer 1 — Patterns    Usage-derived retrieval patterns (implicit signal)
  Layer 2 — Facts       Explicitly validated knowledge facts
  Layer 3 — Frameworks  Cross-domain synthesised mental models
  Layer 4 — Application Validated applied procedures
  Layer 5 — Wisdom      Heuristics from accumulated operational experience

Promotion between layers is governed by a configurable PromotionPolicy.
v1 ships Layers 0–2.
"""
see_also   = ["promotion_policy", "knowledge_fact", "retrieval_log"]
extends    = false

[[terms]]
id         = "knowledge_fact"
layer      = "axiom"
term       = "Knowledge Fact"
definition = """
A discrete, human-reviewable proposition extracted or synthesised from
Layer 0 content and validated to Layer 2. A knowledge fact records:
  - The proposition text
  - Source chunk ids
  - Validation state and reviewer
  - Access tier (inherited from source, never downgraded)
  - Embedding provenance
"""
see_also   = ["knowledge_maturity", "promotion_policy"]
extends    = false

[[terms]]
id         = "retrieval_log"
layer      = "axiom"
term       = "Retrieval Log"
definition = """
A persistent record of every retrieval event from the RAG store. Each entry
captures: session id, query hash, chunk ids returned, rerank scores, tier,
scope, and a relevance signal (explicit or implicit). The retrieval log is
the foundation for Layer 1 knowledge maturity and the reinforcement learning
feedback loop.
"""
see_also   = ["knowledge_maturity", "promotion_policy"]
extends    = false

[[terms]]
id         = "promotion_policy"
layer      = "axiom"
term       = "Promotion Policy"
definition = """
A configurable, testable protocol that determines when a piece of content is
eligible to advance from one knowledge maturity layer to the next. Policy
parameters (e.g. minimum retrieval count, minimum positive signal ratio,
mandatory human review) are declared in rag.toml and evaluated by the
promotion pipeline.

The PromotionPolicy interface is implemented in axiom; domain-specific
policies are supplied via extension.
"""
see_also   = ["knowledge_maturity", "retrieval_log"]
example    = """
# rag.toml example
[promotion.layer_0_to_1]
min_retrievals      = 5
min_positive_ratio  = 0.6
require_human_review = false

[promotion.layer_1_to_2]
min_positive_ratio  = 0.8
require_human_review = true
"""
extends    = false

# ---------------------------------------------------------------------------
# Embedding & Retrieval
# ---------------------------------------------------------------------------

[[terms]]
id         = "embedding_provenance"
layer      = "axiom"
term       = "Embedding Provenance"
definition = """
Metadata attached to each embedded chunk recording which model produced
the embedding, the model version, and the embedding dimensionality. Used
to detect stale embeddings after a model transition and to gate cross-model
similarity comparisons.

Fields: embedding_model_id, embedding_dims, embedding_version, needs_reembed.
"""
see_also   = ["lazy_reembedding", "hybrid_search"]
extends    = false

[[terms]]
id         = "lazy_reembedding"
layer      = "axiom"
term       = "Lazy Re-embedding"
definition = """
A strategy for handling embedding model transitions without requiring a
full corpus re-index. Chunks with stale embeddings (needs_reembed = true)
continue to participate in retrieval via the full-text search baseline.
A background job (TIDY) re-embeds stale chunks incrementally.
"""
see_also   = ["embedding_provenance", "hybrid_search"]
extends    = false

[[terms]]
id         = "hybrid_search"
layer      = "axiom"
term       = "Hybrid Search"
definition = """
A retrieval strategy combining full-text search (BM25 / tsvector) with
vector similarity search. Full-text search is the invariant baseline that
works regardless of embedding model; vector search adds semantic recall.
Results from both are merged and optionally reranked by a cross-encoder.
"""
see_also   = ["cross_encoder_reranker", "lazy_reembedding",
              "embedding_provenance"]
extends    = false

[[terms]]
id         = "cross_encoder_reranker"
layer      = "axiom"
term       = "Cross-Encoder Reranker"
definition = """
A model that scores (query, chunk) pairs after initial retrieval to produce
a final relevance ranking. The reranker is model-independent — it can be
upgraded without changing the corpus or embedding model.
"""
see_also   = ["hybrid_search"]
extends    = false

[[terms]]
id         = "extractor"
layer      = "axiom"
term       = "Extractor"
definition = """
A pluggable component in the RAG ingest pipeline responsible for converting
a specific source type (PDF, HTML, transcript, simulation output file, etc.)
into normalised chunks with metadata. Extractors are registered via the
extractor registry and resolved by MIME type or file extension.

Domain-specific extractors (e.g. MCNP output parser) are provided as
extensions; Axiom ships only generic extractors.
"""
see_also   = ["domain_pack"]
extends    = false

# ---------------------------------------------------------------------------
# Research
# ---------------------------------------------------------------------------

[[terms]]
id         = "research_task"
layer      = "axiom"
term       = "Research Task"
definition = """
A bounded unit of autonomous research managed by CURIO. A research task
has a lifecycle: question → plan → approval → execution → synthesis →
validation → report. Tasks respect tier/scope boundaries and produce
audit-logged provenance for every step.
"""
see_also   = ["standing_order", "source_connector", "synthesis_report"]
extends    = false

[[terms]]
id         = "standing_order"
layer      = "axiom"
term       = "Standing Order"
definition = """
A persistent research interest that triggers periodic re-research and
briefing generation. Standing orders monitor configured sources on a
cadence (daily, weekly, monthly) and deliver delta briefings when new
findings are discovered. Scope can be personal, tenant, or community.
"""
see_also   = ["research_task", "source_connector"]
extends    = false

[[terms]]
id         = "source_connector"
layer      = "axiom"
term       = "Source Connector"
definition = """
A pluggable component that searches and retrieves documents from a specific
external source for CURIO research. Source connectors declare a tier
ceiling (the highest sensitivity of content they handle), implement search
and retrieve interfaces, and are discovered via the extension system.

Axiom ships generic connectors (RAG corpus, web search, arXiv). Domain
extensions provide specialised connectors (e.g. NRC ADAMS, PubMed, IAEA INIS).
"""
see_also   = ["research_task", "extractor", "tier"]
extends    = false

[[terms]]
id         = "research_validator"
layer      = "axiom"
term       = "Research Validator"
definition = """
A domain-specific rule that validates claims extracted during research.
Validators are triggered by regex pattern matching on claim text and check
domain constraints (e.g. cross-section claims must cite evaluated nuclear
data libraries, regulatory guidance must reference the current revision).

Axiom ships generic validators (citation existence, URL reachability, date
currency). Domain extensions provide specialised validators.
"""
see_also   = ["research_task", "source_connector", "knowledge_fact"]
extends    = false

[[terms]]
id         = "synthesis_report"
layer      = "axiom"
term       = "Synthesis Report"
definition = """
The structured output of a completed research task. Contains an executive
summary, detailed findings per sub-question, cross-question themes,
knowledge gaps, suggested follow-up, proposed knowledge facts, and a
citation list with verification status. Reports respect tier boundaries —
cross-tier research produces separate sub-reports per tier.
"""
see_also   = ["research_task", "knowledge_fact"]
extends    = false

[[terms]]
id         = "corpus_gap"
layer      = "axiom"
term       = "Corpus Gap"
definition = """
A topic area where RAG retrieval confidence is consistently low across
multiple queries. Gaps are detected from the interaction log (passive) and
from research task findings (active). CURIO's self-research cycle
attempts to fill gaps by discovering and proposing new content.
"""
see_also   = ["research_task", "knowledge_maturity", "retrieval_log"]
extends    = false

# ---------------------------------------------------------------------------
# Platform
# ---------------------------------------------------------------------------

[[terms]]
id         = "domain_configuration"
layer      = "axiom"
term       = "Domain Configuration"
definition = """
The set of files and extension manifests that specialise Axiom for a
particular deployment domain. Domain configuration defines tier names and
properties, store assignments, extraction profiles, and domain-specific
extension points.

In axiom, domain configuration lives in runtime/config/ and is
gitignored; config.example/ provides templates.
"""
see_also   = ["tier", "isolated_store"]
extends    = false

# ---------------------------------------------------------------------------
# Producing sites: one ingest path, local first (2026-10-08)
# ---------------------------------------------------------------------------

[[terms]]
id         = "local_medallion"
layer      = "axiom"
term       = "Local Medallion"
definition = """
The medallion on the node where readings are produced. A collector writes
every reading to it first, through the same ingest path a shared node uses,
so the local copy and any upstream copy are produced by one code path. It
is both the site's archive and the buffer that store-and-forward ships from.
What it does beyond bronze is set by the node's functions, not by a second
installation.
"""
see_also   = ["archive_role", "forwarder", "record_of_truth", "reconcile"]
extends    = false

[[terms]]
id         = "archive_role"
layer      = "axiom"
term       = "Archive Role"
definition = """
A local medallion configured to keep bronze with long retention, plus a
read-only data-access layer so the site can use its own copy: CLI data verbs
(values with units, quality and provenance, and CSV or Parquet export), an
MCP server offering the same read-only, site-scoped queries to any AI
harness, and a read-only database role for standard tools. Chat and the web
app are installed but off, and a feature switch enables them without
reinstalling. The default for a site that contributes readings to a shared
node.
"""
see_also   = ["local_medallion", "contributor_mode", "local_first_mode"]
extends    = false

[[terms]]
id         = "contributor_mode"
layer      = "axiom"
term       = "Contributor Mode"
definition = """
A node configuration in which the local medallion runs in the archive role
and the forwarder is on. The shared upstream node is the record of truth;
the local copy is the origin backup that can refill gaps upstream.
"""
see_also   = ["local_first_mode", "record_of_truth", "forwarder", "archive_role"]
extends    = false

[[terms]]
id         = "local_first_mode"
layer      = "axiom"
term       = "Local-First Mode"
definition = """
A node configuration in which the full local platform runs (silver, gold,
web app, analytics) and the forwarder is off until the site's owner turns
it on. The local node is the record of truth; an upstream node holds only a
copy of what the sharing policy sends it. Contributor and local-first mode
are the same installation with different functions enabled.
"""
see_also   = ["contributor_mode", "sharing_policy", "record_of_truth"]
extends    = false

[[terms]]
id         = "record_of_truth"
layer      = "axiom"
term       = "Record of Truth"
definition = """
A node property, local or upstream, naming which copy of a site's readings
is authoritative. It is configuration, not a hard-coded rule, and the
reconcile job reads it. Because readings are immutable and corrections are
layered records, the two copies never disagree in normal operation; the
property decides which side's corrections apply where.
"""
see_also   = ["reconcile", "contributor_mode", "local_first_mode"]
extends    = false

[[terms]]
id         = "forwarder"
layer      = "axiom"
term       = "Forwarder"
definition = """
The process that ships bronze from a local medallion's outbox to an upstream
node. It reuses the ingest edge's outbox, acknowledges per batch, and chooses
its transport in order: the upstream intake when healthy, then an
intermediary drop when configured, then waiting. Switching transports uses
hysteresis and is announced. Every batch is idempotent on reading identity
plus content hash, so a batch can never land twice.
"""
see_also   = ["local_medallion", "sharing_policy", "ingest_edge"]
extends    = false

[[terms]]
id         = "realtime_lane"
layer      = "axiom"
term       = "Realtime Lane"
definition = """
The in-memory path from a collector to live consumers. It fans out before
any storage, so no database or journal is ever upstream of it. It keeps the
latest value per channel, drops stale values under pressure, stores nothing,
and never blocks the store-and-forward path or waits on it.
"""
see_also   = ["local_medallion", "forwarder"]
extends    = false

[[terms]]
id         = "sharing_policy"
layer      = "axiom"
term       = "Sharing Policy"
definition = """
The site owner's statement of what the forwarder sends upstream: which feeds
or channels, from what start date, with what delay. The owner can stop
sharing at any time. Stopping halts new sends; it does not delete what the
upstream node already holds, and a site's local retention expiring is never
an upstream deletion. Withdrawing a published record is a separate, explicit
act that travels the same path.
"""
see_also   = ["forwarder", "local_first_mode"]
extends    = false

[[terms]]
id         = "reconcile"
layer      = "axiom"
term       = "Reconcile"
definition = """
The job that compares a local medallion and its upstream copy per channel
per hour, by count and content hash. It fills a gap from whichever side has
the reading, treats local expiry as expiry rather than divergence, and flags
two different values at the same reading identity for a person to decide.
It never resolves a conflicting value on its own.
"""
see_also   = ["record_of_truth", "local_medallion", "history_source"]
extends    = false

[[terms]]
id         = "history_source"
layer      = "axiom"
term       = "History Source"
definition = """
A site's own existing archive of past readings, read by the collector for
backfill and to fill gaps the reconcile job finds. It is never the primary
source: live readings come from the instrument interface. It may stand in, as
a labelled temporary fallback, for instruments the live interface cannot
reach.
"""
see_also   = ["realtime_lane", "reconcile", "local_medallion"]
extends    = false

[[terms]]
id         = "ingest_edge"
layer      = "axiom"
term       = "Ingest Edge"
definition = """
A node with only the ingest function: it accepts authenticated pushes,
holds them in an outbox, and exports them to the node that owns the data
platform, which pulls exactly once (ADR-177). Its outbox code is reused by
the forwarder.
"""
see_also   = ["forwarder", "local_medallion"]
extends    = false

[[terms]]
id         = "switch_plan"
layer      = "axiom"
term       = "Switch Plan"
definition = """
One change run through the switch runner: prepare (build the new beside the
old), prove (declared probes), commit (one bounded switch under a lock budget),
soak (a watch period with automatic rollback on a fault) and retire (remove the
old; explicit when it cannot be undone). A domain supplies four hooks: prepare,
probe, commit and rollback (ADR-197).
"""
see_also   = ["lock_budget", "retire_task"]
extends    = false

[[terms]]
id         = "lock_budget"
layer      = "axiom"
term       = "Lock Budget"
definition = """
The longest a switch may hold an exclusive lock or otherwise stop readers. The
default is two seconds. A commit that cannot meet it is refused before it takes
the lock; bulk work (copying a table's tail) happens outside it (ADR-197).
"""
see_also   = ["switch_plan"]
extends    = false

[[terms]]
id         = "retire_task"
layer      = "axiom"
term       = "Retire Task"
definition = """
The follow-up created when a switch commits: remove the old thing once the soak
has passed. It has an owner, a due time and a read-only check, and is tracked as a
commitment (ADR-196), so the old table, slot or version is not left behind because
a session ended (ADR-197).
"""
see_also   = ["switch_plan"]
extends    = false

# ---------------------------------------------------------------------------
# Twin Systems and Computational Models
# See: docs/reference/twin-concepts.md
# ---------------------------------------------------------------------------

[[terms]]
id         = "physical_counterpart"
layer      = "axiom"
term       = "Physical Counterpart"
definition = """
The real system a virtual representation corresponds to. Sources also call it the physical twin or the asset.
"""
see_also   = ["digital_twin"]

[[terms]]
id         = "computational_model"
layer      = "axiom"
term       = "Computational Model"
definition = """
Any executable representation of a system. Not an LLM. Say model alone only where it cannot be read as an LLM.
"""
see_also   = ["surrogate"]

[[terms]]
id         = "high_fidelity_model"
layer      = "axiom"
term       = "High-Fidelity Model"
definition = """
The most accurate computational model available for a system, used as a reference for surrogates.
"""
see_also   = ["surrogate"]

[[terms]]
id         = "surrogate"
layer      = "axiom"
term       = "Surrogate"
definition = """
A cheaper stand-in that approximates a higher-fidelity model or a system's behaviour. The umbrella term, with three classes: data-fit surrogate, reduced-order model and multi-fidelity surrogate.
"""
see_also   = ["data_fit_surrogate", "reduced_order_model", "multi_fidelity_surrogate"]

[[terms]]
id         = "data_fit_surrogate"
layer      = "axiom"
term       = "Data-Fit Surrogate"
definition = """
A surrogate built by regression or interpolation of data, such as a neural network or a Gaussian process.
"""
see_also   = ["surrogate"]

[[terms]]
id         = "reduced_order_model"
layer      = "axiom"
term       = "Reduced-Order Model (ROM)"
definition = """
A surrogate derived from a high-fidelity model or its solution data by lowering the state dimension. Every ROM is a surrogate. Not every surrogate is a ROM.
"""
see_also   = ["surrogate"]

[[terms]]
id         = "multi_fidelity_surrogate"
layer      = "axiom"
term       = "Multi-Fidelity Surrogate"
definition = """
A surrogate that uses a lower-fidelity model, with coarser resolution or less physics, in place of the expensive one.
"""
see_also   = ["surrogate"]

[[terms]]
id         = "assembly"
layer      = "axiom"
term       = "Assembly"
definition = """
A composite of coupled computational models, any of which may be surrogates.
"""
see_also   = ["surrogate"]

[[terms]]
id         = "digital_model"
layer      = "axiom"
term       = "Digital Model"
definition = """
The lowest rung of integration: data moves between the physical and digital systems only by hand.
"""
see_also   = ["digital_shadow", "digital_twin"]

[[terms]]
id         = "digital_shadow"
layer      = "axiom"
term       = "Digital Shadow"
definition = """
The middle rung of integration: data flows automatically from the physical to the digital system, and nothing flows back without a person.
"""
see_also   = ["digital_model", "digital_twin"]

[[terms]]
id         = "digital_twin"
layer      = "axiom"
term       = "Digital Twin"
definition = """
The top rung of integration: data flows automatically both ways, and digital outputs change the physical counterpart. Use twin system for the whole body of work.
"""
see_also   = ["digital_model", "digital_shadow"]

[[terms]]
id         = "context_of_use"
layer      = "axiom"
term       = "Context of Use"
definition = """
The specific role and decision a computational model supports. Credibility is always assessed for one context of use.
"""
see_also   = ["credibility"]

[[terms]]
id         = "credibility"
layer      = "axiom"
term       = "Credibility"
definition = """
The justified trust in a computational model for one context of use, in proportion to model risk. Never a general property of a model.
"""
see_also   = ["context_of_use", "credibility_profile"]

[[terms]]
id         = "credibility_profile"
layer      = "axiom"
term       = "Credibility Profile"
definition = """
The stages and evidence a domain layer requires before a revision can be promoted. Axiom enforces it without knowing what the evidence means.
"""
see_also   = ["credibility", "promotion"]

[[terms]]
id         = "validation_domain"
layer      = "axiom"
term       = "Validation Domain"
definition = """
The conditions where a model was checked against reality. Use inside it is interpolation, and use outside it is extrapolation.
"""
see_also   = ["application_domain"]

[[terms]]
id         = "application_domain"
layer      = "axiom"
term       = "Application Domain"
definition = """
The conditions where a model will be used.
"""
see_also   = ["validation_domain"]

[[terms]]
id         = "digital_thread"
layer      = "axiom"
term       = "Digital Thread"
definition = """
The connected record of a revision's origin, data, evidence and use.
"""
see_also   = ["revision"]

[[terms]]
id         = "challenger"
layer      = "axiom"
term       = "Challenger"
definition = """
A revision receiving the same input frames as the served revision, judged but not used by consumers.
"""
see_also   = ["mirror"]

[[terms]]
id         = "mirror"
layer      = "axiom"
term       = "Mirror"
definition = """
Feeding a challenger the same live frames as the served revision. Avoid the term shadow deployment, which collides with digital shadow.
"""
see_also   = ["challenger"]

[[terms]]
id         = "service_class"
layer      = "axiom"
term       = "Service Class"
definition = """
The deadline and resolution a revision declares it meets. Not to be confused with an access tier.
"""
see_also   = ["tier"]
