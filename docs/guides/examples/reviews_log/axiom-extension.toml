[extension]
name = "reviews_log"
version = "0.1.0"
description = "An example reviews log: a reviewer from outside the site signs reviews of another log"
license = "Apache-2.0"
owner = "b-tree-labs"
aeos_version = "0.1.0"

[extension.compatibility]
python = ">= 3.11"
axiom = ">= 0.10"

[[extension.provides]]
kind = "logbook"
id = "reviews_log"
file = "logbook/reviews_log.toml"
display = "Reviews"
description = "A domain-free reviews log to copy when a site is reviewed continuously"
