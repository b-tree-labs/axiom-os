# Copy to .github/workflows/rivet-lander.yml. Replace OWNER and the tag.
name: RIVET lander

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Backstop only: pull_request events (and workflow_run, if enabled) land promptly. Every run
    # that finds open pull requests costs minutes, so keep this sparse; a run with no
    # open pull requests exits in seconds (see "Idle exit" in the README). Every three
    # hours is plenty; hourly is the old default.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      force-full:
        description: "Read neither the unchanged cache nor the pip cache for this run"
        type: boolean
        default: false
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  # Optional: land right after the slowest required gate finishes.
  # workflow_run:
  #   workflows: ["Your slowest gate"]
  #   types: [completed]

concurrency:
  group: rivet-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write        # merge
  pull-requests: write   # sticky comment, labels
  issues: write          # the "needs <owner>" issue, labels
  checks: write          # the neutral RIVET check on a held pull request
  actions: write         # rerun a flaky or cancelled required check
  statuses: read

jobs:
  rivet:
    # A comment or review that carries no /rivet command is ignored by the script, but a
    # job that starts is billed a whole minute. Skip it here, where no runner is started.
    if: >-
      (github.event_name != 'issue_comment' && github.event_name != 'pull_request_review') ||
      contains(github.event.comment.body, '/rivet') ||
      contains(github.event.review.body, '/rivet')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: b-tree-labs/axiom-os/actions/rivet-land@rivet-land-v1
        with:
          owner: OWNER            # your GitHub login
          act: "true"             # "false" reports only
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}  # empty = no tier-1 fixer
          kill-switch: ${{ vars.AXIOM_LANDER_KILL }}
          release-lock: ${{ vars.AXIOM_RELEASE_LOCK }}
          app-id: ${{ vars.RIVET_APP_ID }}                    # empty = Actions token
          app-private-key: ${{ secrets.RIVET_APP_PRIVATE_KEY }}
          force-full: ${{ inputs.force-full }}   # dispatch only; empty otherwise means false
          # Skip a scheduled run when nothing changed since the last full evaluation, for at
          # most this many hours (6 is the default and the lander's window_hours). Keep it
          # above the cron interval, or no scheduled run ever skips.
          # unchanged-max-age-hours: "6"
          # axiom-version: "0.70.51"
          # config: .axiom/release-lander.toml
