# Copy to .github/workflows/rivet-lander.yml. Replace OWNER and the tag.
name: RIVET lander

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 * * * *"   # hourly backstop
  workflow_dispatch:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  # Optional: land right after the slowest required gate finishes.
  # workflow_run:
  #   workflows: ["Your slowest gate"]
  #   types: [completed]

concurrency:
  group: rivet-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write        # merge
  pull-requests: write   # sticky comment, labels
  issues: write          # the "needs <owner>" issue, labels
  checks: write          # the neutral RIVET check on a held pull request
  actions: write         # rerun a flaky or cancelled required check
  statuses: read

jobs:
  rivet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: b-tree-labs/axiom-os/actions/rivet-land@rivet-land-v1
        with:
          owner: OWNER            # your GitHub login
          act: "true"             # "false" reports only
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}  # empty = no tier-1 fixer
          kill-switch: ${{ vars.AXIOM_LANDER_KILL }}
          release-lock: ${{ vars.AXIOM_RELEASE_LOCK }}
          app-id: ${{ vars.RIVET_APP_ID }}                    # empty = Actions token
          app-private-key: ${{ secrets.RIVET_APP_PRIVATE_KEY }}
          # axiom-version: "0.70.43"
          # config: .axiom/release-lander.toml
